name: Publish Short

on:
  schedule:
    - cron: "0 2 * * *"       # 07:30 IST
    - cron: "30 7 * * *"      # 13:00 IST
    - cron: "30 13 * * *"     # 19:00 IST

  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------------
      # PYTHON
      # --------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --------------------------------------------------------
      # NODE.JS / PUTER.JS
      # --------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Puter.js
        run: |
          echo "=========================================="
          echo "🔧 Setting up Node.js / Puter.js"
          echo "=========================================="

          node --version
          npm --version

          npm init -y
          npm install @heyputer/puter.js@2.6.0

          npm list @heyputer/puter.js

      # --------------------------------------------------------
      # FFMPEG
      # --------------------------------------------------------

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

          ffmpeg -version

      # --------------------------------------------------------
      # IMAGEMAGICK
      # --------------------------------------------------------

      - name: Install ImageMagick
        run: |
          sudo apt-get install -y imagemagick

          sudo sed -i \
            's/rights="none" pattern="@\*"/rights="read|write" pattern="@*"/' \
            /etc/ImageMagick-6/policy.xml

          echo "ImageMagick:"
          which convert
          convert --version

      # --------------------------------------------------------
      # PYTHON DEPENDENCIES
      # --------------------------------------------------------

      - name: Install Python dependencies
        run: |
          echo "=========================================="
          echo "🐍 Installing Python dependencies"
          echo "=========================================="

          python --version
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # --------------------------------------------------------
      # YOUTUBE CREDENTIALS
      # --------------------------------------------------------

      - name: Write YouTube client credentials
        run: |
          echo '${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}' > client_secret.json

      # --------------------------------------------------------
      # RUN PIPELINE
      # --------------------------------------------------------

      - name: Run Mint-YT-Factory
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}

          HF_TOKEN: ${{ secrets.HF_TOKEN }}

          PUTER_AUTH_TOKEN: ${{ secrets.PUTER_AUTH_TOKEN }}

          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}

          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}

        run: |
          echo "=========================================="
          echo "🚀 MINT-YT-FACTORY STARTED"
          echo "=========================================="

          echo "Start Time:"
          date

          echo "Runner:"
          uname -a

          echo "Python:"
          python --version

          echo "Node:"
          node --version

          echo "NPM:"
          npm --version

          echo "Memory:"
          free -h

          echo "Disk:"
          df -h

          echo "=========================================="
          echo "🧠 Starting main.py"
          echo "=========================================="

          python -u main.py

      # --------------------------------------------------------
      # UPLOAD FINAL VIDEO
      # --------------------------------------------------------

      - name: Upload Final Video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-video-${{ github.run_id }}
          path: output/**/final.mp4
          if-no-files-found: warn
          retention-days: 7

      # --------------------------------------------------------
      # UPLOAD GENERATED IMAGES
      # --------------------------------------------------------

      - name: Upload Generated Images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-images-${{ github.run_id }}
          path: output/**/visuals/
          if-no-files-found: warn
          retention-days: 7

      # --------------------------------------------------------
      # UPLOAD RESEARCH
      # --------------------------------------------------------

      - name: Upload Research Package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-${{ github.run_id }}
          path: output/**/research.json
          if-no-files-found: warn
          retention-days: 7

      # --------------------------------------------------------
      # UPLOAD SCRIPT
      # --------------------------------------------------------

      - name: Upload Generated Script
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: script-${{ github.run_id }}
          path: output/**/script.json
          if-no-files-found: warn
          retention-days: 7

      # --------------------------------------------------------
      # UPDATE USED TOPICS
      # --------------------------------------------------------

      - name: Commit updated used_topics.json
        if: success()
        run: |
          git config user.name "auto-publish-bot"
          git config user.email "actions@github.com"

          git add used_topics.json

          if git diff --cached --quiet; then
            echo "No topic changes to commit."
            exit 0
          fi

          git commit -m "Update used topics [skip ci]"
          git push

      # --------------------------------------------------------
      # COMPLETE
      # --------------------------------------------------------

      - name: Pipeline complete
        if: success()
        run: |
          echo "=========================================="
          echo "🎉 MINT-YT-FACTORY COMPLETE"
          echo "=========================================="