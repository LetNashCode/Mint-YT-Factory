channel:
  niche: "Curiosity, Mystery, Science, History"
  tone: "Cinematic, suspenseful, fast-paced"
  audience: "Global"

script:
  language: "English"
  target_narration_seconds: 45

voice:
  provider: "tiktok"
  voice_name: "en_us_ghostface"

visuals:
  provider: "imagen"
  orientation: "portrait"

image:
  provider: "imagen"
  model: "imagen-4.0-generate-001"
  width: 1080
  height: 1920
 
video:
  resolution: [1080, 1920]
  fps: 30
  background_music: "assets/music/background.mp3"
  music_volume: 0.08
  sfx_volume: 0.75
  captions:
    font_size: 72

upload:
  auto_upload: true
  privacy_status: "public"
  category_id: "27"
  title_template: "{topic}"
  description_template: "{hook_line}"
  default_tags:
    - shorts
    - facts
    - mystery
    - science
    - history
