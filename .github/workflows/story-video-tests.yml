name: Story Video Tests
on:
  pull_request:
    paths:
      - 'story_real_video_media.py'
      - 'story_identity_runner.py'
      - 'tests/test_story_real_video_media.py'
      - '.github/workflows/story-shorts.yml'
      - '.github/workflows/story-video-tests.yml'
  workflow_dispatch:
    inputs:
      person:
        description: 'Optional live footage preview (no publishing); leave blank for offline tests'
        required: false
        default: ''
        type: string
      list_models:
        description: 'List available Gemini verifier models (no media generation or publishing)'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest requests PyYAML
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: List available Gemini verifier models
        if: github.event_name == 'workflow_dispatch' && inputs.list_models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -u - <<'PY'
          import os, requests
          response = requests.get('https://generativelanguage.googleapis.com/v1beta/models',
              headers={'x-goog-api-key': os.environ['GEMINI_API_KEY']}, params={'pageSize': 1000}, timeout=(10, 30))
          if response.status_code != 200:
              raise RuntimeError(f'Model catalog HTTP {response.status_code}')
          data = response.json()
          models = data.get('models', [])
          print('Catalog fields:', sorted(data), '| model count:', len(models), '| more pages:', bool(data.get('nextPageToken')))
          for model in models:
              print(model.get('name', ''), '|', model.get('displayName', ''), '|', model.get('supportedGenerationMethods', []))
          PY
      - name: Story regression and real FFmpeg integration
        run: python -m pytest -q tests/test_story_media_quality.py tests/test_story_real_video_media.py
      - name: Compile Story and protected production entry points
        run: python -m py_compile story_real_video_media.py story_identity_runner.py interactive_main.py production_entry.py production_entry_runner.py mystery_documentary.py mystery_documentary_runner.py
  live-preview:
    needs: regression
    if: github.event_name == 'workflow_dispatch' && inputs.person != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Retrieve and verify one real-person video preview without publishing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STORY_PREVIEW_PERSON: ${{ inputs.person }}
          STORY_VIDEO_VERIFY_MODEL: ${{ vars.STORY_VIDEO_VERIFY_MODEL || 'gemini-2.5-flash' }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import story_real_video_media as media
          person = media.clean(os.environ['STORY_PREVIEW_PERSON'])
          root = Path('output/story-video-preview')
          root.mkdir(parents=True, exist_ok=True)
          audit = {'person': person, 'providers': [], 'attempts': []}
          accepted = False
          try:
              pool = media.discover(person, audit['providers'])
              buckets = [[item for item in pool if item['provider'] == provider][:8] for provider in ('Wikimedia Commons', 'Internet Archive')]
              pool = [bucket[i] for i in range(8) for bucket in buckets if i < len(bucket)]
              for item in pool:
                  try:
                      stage = 'resolve'
                      url, duration = media.resolve(item)
                      for start, length in media.windows(duration)[:3]:
                          path = root / 'preview.mp4'
                          stage = 'extract'
                          actual = media.extract(url, start, length, path)
                          stage = 'verify'
                          verdict = media.verify(person, {'narration': person + ' speaking about their life'}, item, media.frames(path, actual))
                          audit['attempts'].append({'source': item['source_url'], 'start': start, 'verification': verdict})
                          if media.verification_passes(verdict):
                              accepted = True
                              audit['accepted'] = {'source': item['source_url'], 'start': start, 'end': start + length}
                              break
                  except Exception as exc:
                      audit['attempts'].append({'source': item['source_url'], 'stage': stage, 'error': type(exc).__name__, 'status': getattr(getattr(exc, 'response', None), 'status_code', None), 'detail': str(exc) if isinstance(exc, RuntimeError) else ''})
                  if accepted:
                      break
              if not accepted:
                  raise RuntimeError('No verified preview found; inspect audit.json')
          finally:
              (root / 'audit.json').write_text(json.dumps(audit, indent=2), encoding='utf-8')
              print(json.dumps(audit, indent=2), flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: story-video-preview
          path: output/story-video-preview/
          retention-days: 7
