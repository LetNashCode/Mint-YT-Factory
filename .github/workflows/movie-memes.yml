name: Movie Meme Shorts

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: movie-meme-production
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      MOVIE_MEME_AUTO_UPLOAD: "true"
      MOVIE_MEME_PRIVACY_STATUS: "public"
      MINT_KOKORO_VOICE: af_heart
      MINT_KOKORO_LANG: a
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright Pillow
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Validate secrets
        run: |
          test -n "$GEMINI_API_KEY" || (echo "Missing GEMINI_API_KEY" && exit 1)
          test -n "$YOUTUBE_TOKEN_JSON" || (echo "Missing YOUTUBE_TOKEN_JSON" && exit 1)
      - name: Generate and publish movie meme
        run: python movie_memes_main.py
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-meme-short-${{ github.run_number }}
          path: artifacts/movie-memes/
          if-no-files-found: ignore
          retention-days: 7
