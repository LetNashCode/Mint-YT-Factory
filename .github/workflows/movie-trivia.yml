name: Movie Trivia Shorts

on:
  schedule:
    # 18:00 IST every day.
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: movie-trivia-production
  cancel-in-progress: false

jobs:
  build-and-publish-movie-trivia:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      MOVIE_AUTO_UPLOAD: "true"
      MOVIE_PRIVACY_STATUS: "public"
      MINT_KOKORO_VOICE: af_heart
      MINT_KOKORO_LANG: a
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright

      - name: Install PlayPhrase browser runtime
        run: python -m playwright install --with-deps chromium

      - name: Validate existing repository secrets
        run: |
          test -n "$GEMINI_API_KEY" || (echo "Missing GEMINI_API_KEY" && exit 1)
          test -n "$YOUTUBE_TOKEN_JSON" || (echo "Missing YOUTUBE_TOKEN_JSON" && exit 1)

      - name: Generate, render, validate and publish Movie Trivia Short
        run: python movie_trivia_main.py

      - name: Upload production artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-trivia-short-${{ github.run_number }}
          path: artifacts/movie-trivia/
          if-no-files-found: ignore
          retention-days: 7
