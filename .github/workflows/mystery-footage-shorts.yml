name: Mystery Footage Shorts

on:
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * 2,5"

permissions:
  contents: read

concurrency:
  group: mystery-footage-production
  cancel-in-progress: false

jobs:
  build-mystery-footage-short:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      MINT_KOKORO_VOICE: af_heart
      MINT_KOKORO_LANG: a
      MYSTERY_FOOTAGE_ALLOW_UNVERIFIED: "false"
      MYSTERY_FOOTAGE_AUTO_DISCOVER: "false"
      MYSTERY_FOOTAGE_AUTO_UPLOAD: "true"
      MYSTERY_FOOTAGE_PRIVACY_STATUS: private
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install Pillow
      - name: Validate required secrets
        run: |
          test -n "$GEMINI_API_KEY" || (echo "Missing GEMINI_API_KEY" && exit 1)
          test -n "$YOUTUBE_TOKEN_JSON" || (echo "Missing YOUTUBE_TOKEN_JSON" && exit 1)
      - name: Generate and publish mystery footage Short
        run: python mystery_footage_shorts.py
      - name: Upload production artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mystery-footage-short-${{ github.run_number }}
          path: artifacts/mystery-footage/
          if-no-files-found: ignore
          retention-days: 7
