name: Story Shorts

on:
  schedule:
    - cron: "0 5 * * *"       # 10:30 IST
    - cron: "0 11 * * *"      # 16:30 IST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: mint-yt-factory-story-shorts
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install production dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg imagemagick tesseract-ocr espeak-ng
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -r requirements.txt

      - name: Verify pipeline
        run: |
          python -m py_compile interactive_main.py interactive_topics.py interactive_analytics.py generate_script/interactive.py whisper_align.py social_publish.py

      - name: Generate and publish Story Short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION }}
          SOCIAL_PUBLISH_STRICT: ${{ vars.SOCIAL_PUBLISH_STRICT }}
        run: python -u interactive_main.py

      - name: Persist Story sequence state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add story_topic_history.json pending_story.json story_counter.json story_candidates.json analytics/story_videos.json analytics/story_comparison.json
          if ! git diff --cached --quiet; then
            git commit -m "Persist Story Shorts sequence state"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload production artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-shorts-${{ github.run_id }}
          path: output/interactive/**
          if-no-files-found: warn
          retention-days: 7
