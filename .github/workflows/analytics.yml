name: Refresh YouTube Analytics

on:
  schedule:
    # Run daily after the previous day's Shorts have had time to accumulate data.
    - cron: "30 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: mint-yt-factory-analytics
  cancel-in-progress: false

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install analytics dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "google-auth>=2.29.0" \
            "google-api-python-client>=2.130.0"

      - name: Refresh YouTube performance
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          set -e
          echo "=========================================="
          echo "📊 MINT-YT-FACTORY ANALYTICS"
          echo "=========================================="
          python -u youtube_analytics.py --refresh

      - name: Commit analytics state
        shell: bash
        run: |
          set -e

          git config user.name "auto-publish-bot"
          git config user.email "actions@github.com"

          git add analytics/videos.json analytics/summary.json

          if git diff --cached --quiet; then
            echo "No analytics changes to commit."
            exit 0
          fi

          git commit -m "Refresh YouTube performance [skip ci]"
          git push
