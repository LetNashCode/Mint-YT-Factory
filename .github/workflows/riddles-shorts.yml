name: Story Shorts
on:
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 11 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  story-shorts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffprobe -version | head -n 1
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Story Shorts runtime
        run: python -m py_compile interactive_main.py interactive_topics.py interactive_analytics.py generate_script/interactive.py whisper_align.py social_publish.py story_person_media.py story_person_sources.py story_media_preflight.py story_social_resume.py tts.py assemble.py stock_media_resilient.py upload_youtube.py validate_video.py music.py sfx.py media_frame_guard.py
      - name: Resume pending Story social publication
        id: resume
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
        run: |
          if [ -f story_social_queue.json ]; then
            python -u story_social_resume.py
            echo "resumed=true" >> "$GITHUB_OUTPUT"
          else
            echo "resumed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate and publish Story Short
        if: steps.resume.outputs.resumed != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          FLICKR_API_KEY: ${{ secrets.FLICKR_API_KEY }}
          EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          set -euo pipefail
          echo "🔐 Story stock provider credentials:"
          echo "   Pexels: ${PEXELS_API_KEY:+AVAILABLE}"
          echo "   Pixabay: ${PIXABAY_API_KEY:+AVAILABLE}"
          test -n "$PEXELS_API_KEY" || { echo "❌ Missing GitHub secret PEXELS_API_KEY"; exit 1; }
          test -n "$PIXABAY_API_KEY" || { echo "❌ Missing GitHub secret PIXABAY_API_KEY"; exit 1; }
          python -c "from media_frame_guard import patch_assemble_rgb; patch_assemble_rgb(); import runpy; runpy.run_path('interactive_main.py', run_name='__main__')"
      - name: Persist Story Shorts state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot].com"
          git add story_topic_history.json pending_story.json story_counter.json story_candidates.json story_social_queue.json interactive_analytics.json interactive_analytics_history.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Persist Story Shorts state"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "${GITHUB_REF_NAME}"
      - name: Upload Story Shorts artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-shorts-${{ github.run_id }}
          path: output/interactive/**
          if-no-files-found: ignore
          retention-days: 7
