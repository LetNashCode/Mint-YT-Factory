name: Mystery Documentary

on:
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * 2,5"

permissions:
  contents: write

concurrency:
  group: mint-content-factory
  cancel-in-progress: false

jobs:
  build-mystery-documentary:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      MINT_KOKORO_VOICE: am_michael
      MINT_KOKORO_LANG: a
      MYSTERY_FOOTAGE_AUTO_DISCOVER: "true"
      MYSTERY_FOOTAGE_REQUIRE_STORY_SCREEN: "true"
      MYSTERY_FOOTAGE_MIN_STORY_SCORE: "6"
      MYSTERY_FOOTAGE_SKIP_IF_NO_ELIGIBLE: "true"
      # Mystery is the factory's only long-form video format; publish as a normal 16:9 video.
      MYSTERY_FOOTAGE_PRIVACY_STATUS: public
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg
        run: |
          set -euo pipefail

          # GitHub-hosted Ubuntu runners normally include FFmpeg. Use it when
          # available and install it only when necessary. This avoids relying
          # on setup-ffmpeg's external release README/version discovery.
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

          echo "FFmpeg:"
          ffmpeg -version | head -n 1
          echo "FFprobe:"
          ffprobe -version | head -n 1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install Pillow openai-whisper
      - name: Compile Mystery production and quality gates
        run: |
          python -m py_compile mystery_documentary_runner.py mystery_documentary_scene_renderer.py mystery_documentary_captions.py mystery_documentary_quality_gate.py mystery_audio_analysis.py mystery_narration_timing.py upload_youtube.py
          pip install pytest
          python -m pytest -q tests/test_mystery_documentary_quality_gate.py
      - name: Validate required secrets
        run: |
          test -n "$GEMINI_API_KEY" || (echo "Missing GEMINI_API_KEY" && exit 1)
          test -n "$YOUTUBE_TOKEN_JSON" || (echo "Missing YOUTUBE_TOKEN_JSON" && exit 1)
      - name: Discover archive footage candidates
        run: python mystery_footage_multisource_discovery.py
      - name: Screen footage quality and story potential
        run: python mystery_footage_screening.py
      - name: Check production candidate eligibility
        id: gate
        run: python mystery_footage_screening_gate.py
      - name: Generate full-length Mystery Documentary
        if: steps.gate.outputs.eligible == 'true'
        run: python mystery_documentary_runner.py
      - name: Add hybrid documentary captions
        if: steps.gate.outputs.eligible == 'true' && hashFiles('artifacts/mystery-documentary/mystery-documentary.mp4') != ''
        run: |
          python mystery_documentary_captions.py \
            --input artifacts/mystery-documentary/mystery-documentary.mp4 \
            --output artifacts/mystery-documentary/mystery-documentary-captioned.mp4 \
            --keywords artifacts/mystery-documentary/metadata.json
          mv artifacts/mystery-documentary/mystery-documentary-captioned.mp4 artifacts/mystery-documentary/mystery-documentary.mp4
      - name: Validate final Mystery Documentary
        if: steps.gate.outputs.eligible == 'true' && hashFiles('artifacts/mystery-documentary/mystery-documentary.mp4') != ''
        run: python mystery_documentary_quality_gate.py
      - name: Upload documentary to YouTube
        if: steps.gate.outputs.eligible == 'true' && hashFiles('artifacts/mystery-documentary/mystery-documentary.mp4') != ''
        run: |
          python - <<'PY'
          import json
          from upload_youtube import upload_video
          from pathlib import Path
          root = Path('artifacts/mystery-documentary')
          meta = json.loads((root / 'metadata.json').read_text(encoding='utf-8'))
          video_id = upload_video(str(root / 'mystery-documentary.mp4'), meta['video_title'][:90], meta['description'], {'upload': {'privacy_status': 'public', 'category_id': '24', 'video_format': 'landscape'}, 'seo': {'hashtags': meta.get('tags', [])}})
          meta['youtube_video_id'] = video_id
          meta['publication_status'] = 'published'
          (root / 'metadata.json').write_text(json.dumps(meta, indent=2, ensure_ascii=False), encoding='utf-8')
          from mystery_documentary_runner import mark_history_published
          mark_history_published(meta.get('catalog_item_id',''), video_id)
          meta['history_recorded'] = True
          meta['history_status'] = 'published'
          (root / 'metadata.json').write_text(json.dumps(meta, indent=2, ensure_ascii=False), encoding='utf-8')
          from factory_content_memory import publish as publish_factory_topic
          publish_factory_topic(
              meta.get('factory_topic') or meta['video_title'],
              'mystery',
              title=meta['video_title'],
              video_id=video_id,
              workdir=str(root),
              metadata={'catalog_item_id': meta.get('catalog_item_id',''), 'source_url': meta.get('source_url',''), 'creative_strategy': meta.get('creative_strategy','')},
          )
          try:
              from youtube_analytics import record_upload
              record_upload(
                  video_id,
                  meta.get('factory_topic') or meta['video_title'],
                  meta['video_title'],
                  workdir=str(root),
                  production_metadata={'workflow':'mystery','catalog_item_id':meta.get('catalog_item_id',''),'creative_strategy':meta.get('creative_strategy','')},
              )
          except Exception as exc:
              print(f'⚠️ Mystery learning analytics record unavailable: {type(exc).__name__}: {exc}')
          PY
      # Upload before the history commit step because the commit step may temporarily
      # stash generated/untracked artifacts while rebasing.
      - name: Upload documentary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mystery-documentary-${{ github.run_number }}
          path: artifacts/mystery-documentary/
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit discovery, screening, and video history
        if: always()
        run: |
          if git diff --quiet -- mystery_footage_catalog.json mystery_footage_history.json analytics/topic_history.json analytics/videos.json analytics/playbook.json analytics/factory_memory_state.json; then
            echo "No catalog or history changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add mystery_footage_catalog.json mystery_footage_history.json analytics/topic_history.json analytics/videos.json analytics/playbook.json analytics/factory_memory_state.json
            git commit -m "Record mystery documentary footage history"
            # Generated artifacts and quality-gate state can dirty the runner worktree.
            # Preserve them locally while rebasing the small durable history commit.
            stash_created=false
            if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
              git stash push --include-untracked -m "mystery-run-generated-state" >/dev/null
              stash_created=true
            fi
            git pull --rebase origin main
            git push origin HEAD:main
            if [ "$stash_created" = true ]; then
              git stash drop >/dev/null || true
            fi
          fi
