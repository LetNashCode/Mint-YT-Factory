name: Story Shorts
on:
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      test_only:
        description: "Run offline Story tests only; no generation, uploads or state changes"
        required: false
        default: false
        type: boolean
      story_person:
        description: "Optional person (provide the story premise too)"
        required: false
        default: ""
        type: string
      story_topic:
        description: "Optional factual story premise for that person"
        required: false
        default: ""
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: story-shorts-pipeline
  cancel-in-progress: false
jobs:
  quality-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline test tools
        run: |
          pip install pytest requests PyYAML opencv-python-headless==4.10.0.84
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Story regression, isolation and portrait render tests
        run: python -m pytest -q tests/test_story_media_quality.py tests/test_story_real_video_media.py tests/test_story_visual_upgrade.py
      - name: Compile Story and protected production entry points
        run: python -m py_compile tts.py story_visual_upgrade.py story_identity_runner.py story_real_video_media.py interactive_main.py production_entry.py production_entry_runner.py mystery_documentary.py mystery_documentary_runner.py assemble.py
  story-shorts:
    needs: quality-checks
    if: ${{ inputs.test_only != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq unzip curl
          ffprobe -version | head -n 1
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install opencv-python-headless==4.10.0.84
      - name: Restore latest previous Story render artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p output/interactive
          artifacts_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100"
          artifacts_json="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${artifacts_url}")"
          artifact_id="$(jq -r --arg current "${CURRENT_RUN_ID}" '[.artifacts[] | select((.name // "") | startswith("story-shorts-")) | select(.expired == false) | select((.workflow_run.id // 0) != ($current | tonumber))] | sort_by(.created_at) | reverse | .[0].id // empty' <<< "${artifacts_json}")"
          if [ -n "${artifact_id}" ]; then
            curl -fsSL -L -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" -o /tmp/story-render.zip
            unzip -oq /tmp/story-render.zip -d .
          else
            echo "ℹ️ No previous Story render artifact available"
          fi
      - name: Compile Story Shorts runtime and quality gates
        run: python -m py_compile tts.py interactive_main.py story_render_recovery.py story_social_resume.py story_identity_runner.py story_real_video_media.py story_archival_media.py story_media_quality.py final_video_quality_gate.py publication_state.py social_retry_state.py upload_youtube.py validate_video.py assemble.py
      - name: Resume pending Story social publication
        id: resume
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
        run: |
          set -euo pipefail
          if [ -f story_social_queue.json ]; then
            python -u story_social_resume.py
            echo "resumed=true" >> "$GITHUB_OUTPUT"
          else
            echo "resumed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Recover completed Story render before starting a new render
        id: recover
        if: success() && steps.resume.outputs.resumed != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
        run: |
          set -euo pipefail
          set +e
          python -u story_render_recovery.py
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "recovered=true" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -eq 1 ]; then
            echo "recovered=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Story render recovery failed (exit $rc). No new Story generation will be attempted."
            exit "$rc"
          fi
      - name: Generate and publish Story Short
        timeout-minutes: 60
        if: steps.recover.outputs.recovered != 'true' && steps.resume.outputs.resumed != 'true'
        env:
          STORY_PERSON: ${{ inputs.story_person || '' }}
          STORY_TOPIC: ${{ inputs.story_topic || '' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          STORY_VIDEO_VERIFY_MODEL: ${{ vars.STORY_VIDEO_VERIFY_MODEL || 'gemini-flash-lite-latest' }}
        run: |
          set -euo pipefail
          rm -f .story_gemini_quota_deferred .story_verifier_budget_deferred
          echo "🎬 Story media route: verified real-person video segments (Commons, Internet Archive; no YouTube downloads)"
          python -u youtube_auth_preflight.py
          python -u - <<'PY'
          import sys, traceback
          try:
              from media_frame_guard import patch_assemble_rgb
              patch_assemble_rgb()
              import story_topic_runtime, story_stock_runtime, story_topic_media_lock
              import story_identity_runner
              story_identity_runner.main()
          except Exception:
              traceback.print_exc(file=sys.stdout)
              raise SystemExit(1)
          PY
      - name: Report Story media diagnostics
        if: failure()
        run: |
          python -u - <<'PY'
          import json
          from pathlib import Path
          audits = sorted(Path('output/interactive').rglob('story_video_audit.json'), key=lambda p: p.stat().st_mtime)
          if audits:
              data = json.loads(audits[-1].read_text())
              print(json.dumps({'person': data.get('person'), 'providers': data.get('providers'),
                  'selected_count': len(data.get('selected', [])), 'last_attempts': data.get('attempts', [])[-20:]}, indent=2))
          else:
              print('No Story media audit was created before the failure.')
          PY
      - name: Verify Story Shorts completed publication
        if: always()
        run: |
          set -euo pipefail
          status_file=".story_publication_status.json"
          if [ ! -f "$status_file" ]; then
            echo "::error::Story Shorts finished without a publication status file. No successful publication was confirmed."
            exit 1
          fi
          status="$(jq -r '.status // ""' "$status_file")"
          video_id="$(jq -r '.video_id // ""' "$status_file")"
          url="$(jq -r '.youtube_url // ""' "$status_file")"
          echo "Story publication status: $status"
          if [ "$status" != "complete" ] || [ -z "$video_id" ]; then
            reason="$(jq -r '.reason // "No complete publication was confirmed."' "$status_file")"
            echo "::error::Story Shorts did not complete successfully. Status=$status Reason=$reason"
            exit 1
          fi
          echo "## Story Shorts publication confirmed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- YouTube video ID: `$video_id`" >> "$GITHUB_STEP_SUMMARY"
          echo "- YouTube URL: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: `COMPLETE`" >> "$GITHUB_STEP_SUMMARY"
      - name: Persist Story Shorts state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for state_file in story_topic_history.json pending_story.json story_counter.json story_candidates.json story_footage_catalog.json story_social_queue.json interactive_analytics.json interactive_analytics_history.json .story_publication_status.json .story_deferred .story_gemini_quota_deferred .story_verifier_budget_deferred; do
            if [ -f "$state_file" ] || git ls-files --error-unmatch "$state_file" >/dev/null 2>&1; then
              git add -A -- "$state_file"
            fi
          done
          git diff --cached --quiet || git commit -m "Persist Story Shorts state"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "${GITHUB_REF_NAME}"
      - name: Upload Story Shorts artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-shorts-${{ github.run_id }}
          path: output/interactive/**
          if-no-files-found: ignore
          retention-days: 7
