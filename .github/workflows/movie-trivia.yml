name: Reddit Horror Commentary Shorts

on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reddit-horror-production
  cancel-in-progress: false

jobs:
  build-and-publish-reddit-horror:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
      REDDIT_HORROR_AUTO_UPLOAD: "true"
      REDDIT_HORROR_PRIVACY_STATUS: "public"
      MINT_KOKORO_VOICE: af_heart
      MINT_KOKORO_LANG: a
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install Pillow
      - name: Validate required secrets
        run: |
          test -n "$GEMINI_API_KEY" || (echo "Missing GEMINI_API_KEY" && exit 1)
          test -n "$YOUTUBE_TOKEN_JSON" || (echo "Missing YOUTUBE_TOKEN_JSON" && exit 1)
          test -n "$REDDIT_CLIENT_ID" || (echo "Missing REDDIT_CLIENT_ID" && exit 1)
          test -n "$REDDIT_CLIENT_SECRET" || (echo "Missing REDDIT_CLIENT_SECRET" && exit 1)
          test -n "$REDDIT_USER_AGENT" || (echo "Missing REDDIT_USER_AGENT" && exit 1)
      - name: Generate, render and publish Reddit horror commentary Short
        run: python reddit_horror_commentary.py
      - name: Upload production artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reddit-horror-short-${{ github.run_number }}
          path: artifacts/reddit-horror/
          if-no-files-found: ignore
          retention-days: 7
