name: Test Puter Image Generation

on:
  workflow_dispatch:

jobs:
  test-puter:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate Puter test image
        run: node generate_images_puter.js

      - name: Upload test image
        uses: actions/upload-artifact@v4
        with:
          name: puter-test-image
          path: puter_test_output/puter_test.png
          if-no-files-found: error