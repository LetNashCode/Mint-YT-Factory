name: Mystery Documentary

on:
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * 2,5"

permissions:
  contents: write

concurrency:
  group: mystery-documentary-production
  cancel-in-progress: false

jobs:
  build-mystery-documentary:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      MINT_KOKORO_VOICE: am_michael
      MINT_KOKORO_LANG: a
      MYSTERY_FOOTAGE_AUTO_DISCOVER: "true"
      MYSTERY_FOOTAGE_REQUIRE_STORY_SCREEN: "true"
      MYSTERY_FOOTAGE_MIN_STORY_SCORE: "6"
      MYSTERY_FOOTAGE_SKIP_IF_NO_ELIGIBLE: "true"
      MYSTERY_FOOTAGE_AUTO_UPLOAD: "false"
      MYSTERY_FOOTAGE_PRIVACY_STATUS: private
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install Pillow openai-whisper
      - name: Validate required secrets
        run: |
          test -n "$GEMINI_API_KEY" || (echo "Missing GEMINI_API_KEY" && exit 1)
          test -n "$YOUTUBE_TOKEN_JSON" || (echo "Missing YOUTUBE_TOKEN_JSON" && exit 1)
      - name: Discover archive footage candidates
        run: python mystery_footage_multisource_discovery.py
      - name: Screen footage quality and story potential
        run: python mystery_footage_screening.py
      - name: Check production candidate eligibility
        id: gate
        run: python mystery_footage_screening_gate.py
      - name: Generate full-length Mystery Documentary
        if: steps.gate.outputs.eligible == 'true'
        run: python mystery_documentary_runner.py
      - name: Add hybrid documentary captions
        if: steps.gate.outputs.eligible == 'true' && hashFiles('artifacts/mystery-documentary/mystery-documentary.mp4') != ''
        run: |
          python mystery_documentary_captions.py \
            --input artifacts/mystery-documentary/mystery-documentary.mp4 \
            --output artifacts/mystery-documentary/mystery-documentary-captioned.mp4 \
            --keywords artifacts/mystery-documentary/metadata.json
          mv artifacts/mystery-documentary/mystery-documentary-captioned.mp4 artifacts/mystery-documentary/mystery-documentary.mp4
      - name: Upload documentary privately to YouTube
        if: steps.gate.outputs.eligible == 'true' && hashFiles('artifacts/mystery-documentary/mystery-documentary.mp4') != ''
        run: |
          python - <<'PY'
          import json
          import portrait_export_guard
          portrait_export_guard.ensure_portrait_export = lambda path: path
          from upload_youtube import upload_video
          from pathlib import Path
          root = Path('artifacts/mystery-documentary')
          meta = json.loads((root / 'metadata.json').read_text(encoding='utf-8'))
          video_id = upload_video(str(root / 'mystery-documentary.mp4'), meta['video_title'][:90], meta['description'], {'upload': {'privacy_status': 'private', 'category_id': '24'}, 'seo': {'hashtags': meta.get('tags', [])}})
          meta['youtube_video_id'] = video_id
          (root / 'metadata.json').write_text(json.dumps(meta, indent=2, ensure_ascii=False), encoding='utf-8')
          PY
      - name: Commit discovery, screening, and video history
        if: always()
        run: |
          if git diff --quiet -- mystery_footage_catalog.json mystery_footage_history.json; then
            echo "No catalog or history changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add mystery_footage_catalog.json mystery_footage_history.json
            git commit -m "Record mystery documentary footage history"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload documentary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mystery-documentary-${{ github.run_number }}
          path: artifacts/mystery-documentary/
          if-no-files-found: ignore
          retention-days: 7
