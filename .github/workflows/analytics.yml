name: Refresh YouTube Analytics

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: mint-yt-factory-analytics
  cancel-in-progress: false

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install analytics dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "google-auth>=2.29.0" "google-api-python-client>=2.130.0"
      - name: Refresh YouTube performance and learning
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          set -euo pipefail
          echo "=========================================="
          echo "📊 MINT-YT-FACTORY ANALYTICS + LEARNING"
          echo "=========================================="
          python -u youtube_analytics.py --refresh
          python -u learning_engine.py
      - name: Commit analytics and playbook state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "auto-publish-bot"
          git config user.email "actions@github.com"
          git add analytics/videos.json analytics/summary.json analytics/playbook.json
          if git diff --cached --quiet; then
            echo "No analytics/learning changes to commit."
            exit 0
          fi
          git commit -m "Refresh YouTube analytics and learning playbook [skip ci]"
          git push
