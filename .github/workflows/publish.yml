name: Publish Short

on:
  schedule:
    - cron: "0 2 * * *"       # 07:30 IST
    - cron: "30 7 * * *"      # 13:00 IST
    - cron: "30 13 * * *"     # 19:00 IST

  workflow_dispatch: {}

# Prevent two publishing jobs from running simultaneously.
concurrency:
  group: mint-yt-factory-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # ============================================================
      # CHECK SYSTEM TOOLS
      #
      # IMPORTANT:
      # Do NOT run apt-get update/install here.
      #
      # The previous workflow spent ~10 minutes downloading FFmpeg
      # and its 99 dependencies before the runner cancelled it.
      # ============================================================

      - name: Check system tools
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "🔧 CHECKING SYSTEM TOOLS"
          echo "=========================================="

          echo ""
          echo "OS:"
          cat /etc/os-release | head -n 5

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "FFmpeg:"
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "✅ FFmpeg found"
            command -v ffmpeg
            ffmpeg -version | head -n 1
          else
            echo "❌ FFmpeg is NOT available on this runner."
            echo ""
            echo "PATH:"
            echo "$PATH"
            echo ""
            echo "Available FFmpeg locations:"
            find /usr /opt -type f -name ffmpeg 2>/dev/null | head -n 20 || true
            exit 1
          fi

          echo ""
          echo "ImageMagick:"
          if command -v magick >/dev/null 2>&1; then
            echo "✅ ImageMagick 'magick' found"
            command -v magick
            magick --version | head -n 3

          elif command -v convert >/dev/null 2>&1; then
            echo "✅ ImageMagick 'convert' found"
            command -v convert
            convert --version | head -n 3

          else
            echo "❌ ImageMagick is NOT available on this runner."
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "✅ SYSTEM TOOL CHECK COMPLETE"
          echo "=========================================="

      # ============================================================
      # CONFIGURE IMAGEMAGICK
      #
      # assemble.py uses MoviePy TextClip.
      # ============================================================

      - name: Configure ImageMagick
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "🖼️ CONFIGURING IMAGEMAGICK"
          echo "=========================================="

          IMAGEMAGICK_BINARY=""

          if command -v magick >/dev/null 2>&1; then
            IMAGEMAGICK_BINARY="$(command -v magick)"
          elif command -v convert >/dev/null 2>&1; then
            IMAGEMAGICK_BINARY="$(command -v convert)"
          fi

          if [ -z "$IMAGEMAGICK_BINARY" ]; then
            echo "❌ Could not locate ImageMagick."
            exit 1
          fi

          echo "Using:"
          echo "$IMAGEMAGICK_BINARY"

          echo "IMAGEMAGICK_BINARY=$IMAGEMAGICK_BINARY" >> "$GITHUB_ENV"

          # ----------------------------------------------------------
          # ImageMagick 6
          # ----------------------------------------------------------

          if [ -f /etc/ImageMagick-6/policy.xml ]; then
            echo "Found ImageMagick 6 policy."

            sudo sed -i \
              's/rights="none" pattern="@\*"/rights="read|write" pattern="@*"/' \
              /etc/ImageMagick-6/policy.xml \
              || true
          fi

          # ----------------------------------------------------------
          # ImageMagick 7
          # ----------------------------------------------------------

          if [ -f /etc/ImageMagick-7/policy.xml ]; then
            echo "Found ImageMagick 7 policy."

            sudo sed -i \
              's/rights="none" pattern="@\*"/rights="read|write" pattern="@*"/' \
              /etc/ImageMagick-7/policy.xml \
              || true
          fi

          echo ""
          echo "Testing ImageMagick..."

          TMP_IMAGE="$(mktemp --suffix=.png)"

          "$IMAGEMAGICK_BINARY" \
            -size 200x100 \
            xc:white \
            "$TMP_IMAGE"

          test -s "$TMP_IMAGE"

          rm -f "$TMP_IMAGE"

          echo "✅ ImageMagick test passed."

          echo "=========================================="
          echo "✅ IMAGEMAGICK READY"
          echo "=========================================="

      # ============================================================
      # PYTHON DEPENDENCIES
      # ============================================================

      - name: Install Python dependencies
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "🐍 INSTALLING PYTHON DEPENDENCIES"
          echo "=========================================="

          python --version
          python -m pip --version

          python -m pip install --upgrade pip

          echo ""
          echo "Installing requirements.txt..."

          python -m pip install \
            --prefer-binary \
            -r requirements.txt

          echo ""
          echo "=========================================="
          echo "🔍 VERIFYING PYTHON PACKAGES"
          echo "=========================================="

          python - <<'PY'
          import sys

          print("Python:", sys.version)

          packages = [
              "google.genai",
              "requests",
              "moviepy",
              "PIL",
              "yaml",
              "google.auth",
              "googleapiclient",
              "torch",
              "whisper",
              "ffmpeg",
          ]

          failed = []

          for package in packages:
              try:
                  module = __import__(package)
                  version = getattr(module, "__version__", "unknown")
                  print(f"✅ {package}: {version}")
              except Exception as e:
                  print(f"❌ {package}: {e}")
                  failed.append(package)

          if failed:
              print("")
              print("Missing/broken packages:")
              for package in failed:
                  print(" -", package)

              # Do not fail yet for whisper_align because it may be
              # supplied by the repository itself.
              if failed != ["whisper_align"]:
                  sys.exit(1)
          PY

          echo ""
          echo "=========================================="
          echo "✅ PYTHON DEPENDENCIES READY"
          echo "=========================================="

      # ============================================================
      # VERIFY PROJECT IMPORTS
      #
      # This catches missing whisper_align BEFORE main.py starts.
      # ============================================================

      - name: Verify project modules
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "🔬 VERIFYING PROJECT MODULES"
          echo "=========================================="

          python - <<'PY'
          import importlib

          modules = [
              "whisper_align",
              "assemble",
          ]

          for name in modules:
              try:
                  module = importlib.import_module(name)
                  print(f"✅ {name}: {module.__file__}")
              except Exception as e:
                  print(f"❌ {name}: {e}")
                  raise

          print("")
          print("✅ Project imports successful.")
          PY

      # ============================================================
      # YOUTUBE CREDENTIALS
      # ============================================================

      - name: Write YouTube client credentials
        shell: bash
        env:
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
        run: |
          set -e

          echo "=========================================="
          echo "🔐 PREPARING YOUTUBE CREDENTIALS"
          echo "=========================================="

          printf '%s' "$YOUTUBE_CLIENT_SECRET_JSON" > client_secret.json

          test -s client_secret.json

          echo "✅ YouTube client credentials created."

      # ============================================================
      # PIPELINE
      # ============================================================

      - name: Run Mint-YT-Factory
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          IMAGEMAGICK_BINARY: ${{ env.IMAGEMAGICK_BINARY }}

        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "🚀 MINT-YT-FACTORY STARTED"
          echo "=========================================="

          echo ""
          echo "Start Time:"
          date

          echo ""
          echo "Runner:"
          uname -a

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "FFmpeg:"
          ffmpeg -version | head -n 1

          echo ""
          echo "ImageMagick:"
          if command -v magick >/dev/null 2>&1; then
            magick --version | head -n 1
          else
            convert --version | head -n 1
          fi

          echo ""
          echo "Memory:"
          free -h

          echo ""
          echo "Disk:"
          df -h

          echo ""
          echo "=========================================="
          echo "🔬 RESEARCH → SCRIPT → VISUALS →"
          echo "   TTS → CAPTIONS → VIDEO → YOUTUBE"
          echo "=========================================="

          START=$(date +%s)

          python -u main.py

          END=$(date +%s)
          ELAPSED=$((END - START))

          echo ""
          echo "=========================================="
          echo "⏱️ PIPELINE TIME"
          echo "${ELAPSED} seconds"
          echo "=========================================="

      # ============================================================
      # UPLOAD FINAL VIDEO
      # ============================================================

      - name: Upload Final Video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-video-${{ github.run_id }}
          path: output/**/final.mp4
          if-no-files-found: warn
          retention-days: 7

      # ============================================================
      # UPLOAD GENERATED IMAGES
      # ============================================================

      - name: Upload Generated Images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-images-${{ github.run_id }}
          path: output/**/visuals/
          if-no-files-found: warn
          retention-days: 7

      # ============================================================
      # UPLOAD RESEARCH
      # ============================================================

      - name: Upload Research Package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-${{ github.run_id }}
          path: output/**/research.json
          if-no-files-found: warn
          retention-days: 7

      # ============================================================
      # UPLOAD SCRIPT
      # ============================================================

      - name: Upload Generated Script
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: script-${{ github.run_id }}
          path: output/**/script.json
          if-no-files-found: warn
          retention-days: 7

      # ============================================================
      # UPDATE USED TOPICS
      # ============================================================

      - name: Commit updated used_topics.json
        if: success()
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "📝 UPDATING USED TOPICS"
          echo "=========================================="

          git config user.name "auto-publish-bot"
          git config user.email "actions@github.com"

          git add used_topics.json

          if git diff --cached --quiet; then
            echo "No topic changes to commit."
            exit 0
          fi

          git commit -m "Update used topics [skip ci]"
          git push

      # ============================================================
      # COMPLETE
      # ============================================================

      - name: Pipeline complete
        if: success()
        shell: bash
        run: |
          echo "=========================================="
          echo "🎉 MINT-YT-FACTORY COMPLETE"
          echo "=========================================="

          echo ""
          echo "Finished:"
          date

          echo ""
          echo "Short successfully generated and published."