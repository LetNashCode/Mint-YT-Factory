name: Publish Short

on:
  schedule:
    - cron: "0 2 * * *"
    - cron: "30 7 * * *"
    - cron: "30 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

concurrency:
  group: mint-yt-factory-publish
  cancel-in-progress: false

env:
  IMAGEMAGICK_BINARY: /usr/bin/convert

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Cache Whisper tiny.en model
        uses: actions/cache@v4
        with:
          path: ~/.cache/whisper
          key: whisper-tiny-en-v2
      - name: Cache Kokoro model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1
      - name: Install system tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg imagemagick tesseract-ocr espeak-ng
          if [ -f /etc/ImageMagick-6/policy.xml ]; then sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@*/' /etc/ImageMagick-6/policy.xml || true; fi
          if [ -f /etc/ImageMagick-7/policy.xml ]; then sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@*/' /etc/ImageMagick-7/policy.xml || true; fi
          test -x "$IMAGEMAGICK_BINARY"
          ffmpeg -version | head -n 1
          "$IMAGEMAGICK_BINARY" --version | head -n 1
          tesseract --version | head -n 1
          espeak-ng --version | head -n 1
      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -r requirements.txt
      - name: Verify environment
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import whisper, torch, moviepy, yaml, google.genai, ffmpeg, pytesseract, requests, soundfile, kokoro
          print("Python environment OK")
          print("Torch:", torch.__version__)
          print("CUDA available:", torch.cuda.is_available())
          print("Tesseract:", pytesseract.get_tesseract_version())
          print("Requests:", requests.__version__)
          print("SoundFile:", soundfile.__version__)
          print("Kokoro: available")
          PY
          test -f main.py
          test -f assemble.py
          test -f tts.py
          test -f whisper_align.py
          test -f sitecustomize.py
          test -f runtime_overrides.py
          test -f production_entry.py
          test -f stock_search.py
          test -f stock_media_resilient.py
          python -m py_compile main.py production_entry.py stock_search.py stock_media_resilient.py tts.py social_publish.py
          python - <<'PY'
          import stock_media_resilient
          print("Stock media pipeline import OK")
          PY
      - name: Restore previous failed Publish Shorts video
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "=========================================="
          echo "♻️ CHECKING FOR PREVIOUS FAILED PUBLISH RUN"
          echo "=========================================="
          rm -rf /tmp/mint-resume
          mkdir -p /tmp/mint-resume
          found=""
          mapfile -t runs < <(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/publish.yml/runs?branch=main&per_page=20" --jq '.workflow_runs[] | select(.id != ('"$GITHUB_RUN_ID"')) | select(.conclusion != null) | select(.conclusion != "success") | [.id,.conclusion,.created_at] | @tsv')
          for row in "${runs[@]}"; do
            run_id="${row%%$'\t'*}"
            rest="${row#*$'\t'}"
            conclusion="${rest%%$'\t'*}"
            echo "🔎 Checking previous run $run_id ($conclusion)"
            artifact_name="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false) | select(.name | startswith("publish-resume-")) | .name' | head -n 1 || true)"
            [ -n "$artifact_name" ] || continue
            rm -rf /tmp/mint-resume/*
            gh run download "$run_id" -n "$artifact_name" -D /tmp/mint-resume
            final_file="$(find /tmp/mint-resume -type f -name final.mp4 -print -quit || true)"
            script_file="$(find /tmp/mint-resume -type f -name script.json -print -quit || true)"
            state_file="$(find /tmp/mint-resume -type f -name publish_state.json -print -quit || true)"
            [ -n "$final_file" ] && [ -n "$script_file" ] && [ -n "$state_file" ] || continue
            final_dir="$(dirname "$final_file")"; script_dir="$(dirname "$script_file")"; state_dir="$(dirname "$state_file")"
            [ "$final_dir" = "$script_dir" ] && [ "$final_dir" = "$state_dir" ] || continue
            workdir_name="$(basename "$final_dir")"
            rm -rf "output/$workdir_name"; mkdir -p output; cp -a "$final_dir" "output/"
            if [ -f "output/$workdir_name/final.mp4" ] && [ -f "output/$workdir_name/script.json" ] && [ -f "output/$workdir_name/publish_state.json" ]; then
              echo "✅ Restored Publish Shorts workdir from failed run $run_id"
              found="$run_id"; break
            fi
            rm -rf "output/$workdir_name"
          done
          if [ -n "$found" ]; then echo "♻️ Resume mode is ready."; else echo "ℹ️ No resumable failed Publish Shorts artifact found. A fresh video will be generated."; fi
      - name: Write YouTube client credentials
        shell: bash
        env:
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
        run: |
          set -euo pipefail
          test -n "$YOUTUBE_CLIENT_SECRET_JSON"
          printf '%s' "$YOUTUBE_CLIENT_SECRET_JSON" > client_secret.json
          test -s client_secret.json
      - name: Run Mint-YT-Factory
        id: run_factory
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION }}
          SOCIAL_PUBLISH_STRICT: ${{ vars.SOCIAL_PUBLISH_STRICT }}
        run: |
          set -euo pipefail
          echo "=========================================="
          echo "🚀 MINT-YT-FACTORY STARTED"
          echo "=========================================="
          echo "Pexels key: ${PEXELS_API_KEY:+AVAILABLE}"
          echo "Pixabay key: ${PIXABAY_API_KEY:+AVAILABLE}"
          date
          python --version
          python -u production_entry.py
      - name: Commit used topics safely
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          changed=""
          if [ -f used_topics.json ]; then git add used_topics.json; changed="yes"; fi
          if [ -f analytics_registry.json ]; then git add analytics_registry.json; changed="yes"; fi
          if [ -f learning_playbook.json ]; then git add learning_playbook.json; changed="yes"; fi
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync publish topic state" || true
            git push origin HEAD:main || true
          else
            echo "ℹ️ No topic/learning state changes to commit."
          fi
      - name: Upload Publish Shorts resume package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-resume-${{ github.run_id }}
          path: |
            output/**/final.mp4
            output/**/script.json
            output/**/publish_state.json
            output/**/social_reel.mp4
            output/**/validation.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Upload final video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-video-${{ github.run_id }}
          path: output/**/final.mp4
          if-no-files-found: ignore
          retention-days: 7
