name: Curious Short
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 4 * * *"
permissions:
  contents: write
  actions: read
concurrency:
  group: mint-content-factory
  cancel-in-progress: false
env:
  IMAGEMAGICK_BINARY: /usr/bin/convert
jobs:
  curious:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Cache Whisper tiny.en model
        uses: actions/cache@v4
        with:
          path: ~/.cache/whisper
          key: whisper-tiny-en-v2
      - name: Cache Kokoro model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1
      - name: Install system tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg imagemagick tesseract-ocr espeak-ng
          test -x "$IMAGEMAGICK_BINARY"
      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -r requirements.txt
          python -m pip install pytest
      - name: Verify Curious Short code
        run: |
          set -euo pipefail
          python -m py_compile curious_entry.py main.py generate_script.py tts.py tts_bridge.py
          python -c "import curious_entry; print('Curious Short entrypoint import OK')"
      - name: Run Curious Short tests
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_curious_entry.py tests/test_topic_intelligence.py tests/test_creative_cooldowns.py tests/test_tts_speed.py
      - name: Write YouTube client credentials
        env:
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
        run: |
          set -euo pipefail
          test -n "$YOUTUBE_CLIENT_SECRET_JSON"
          printf '%s' "$YOUTUBE_CLIENT_SECRET_JSON" > client_secret.json
      - name: YouTube OAuth preflight
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          set -euo pipefail
          test -n "$YOUTUBE_TOKEN_JSON"
          python -u youtube_auth_preflight.py
      - name: Run Curious Short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION }}
          SOCIAL_PUBLISH_STRICT: "false"
        run: |
          set -euo pipefail
          python -u curious_entry.py
      - name: Curious YouTube upload rescue
        if: always()
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          set -euo pipefail
          python -u curious_upload_rescue.py

      - name: Verify final video        run: |
          set -euo pipefail
          final_file="$(find output -type f -name final.mp4 -print -quit || true)"
          test -n "$final_file"
          python -u - "$final_file" <<'PY'
          import sys
          from portrait_export_guard import ensure_portrait_export
          print(ensure_portrait_export(sys.argv[1]))
          PY
      - name: Upload Curious Short artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curious-short-${{ github.run_id }}
          path: |
            output/**/final.mp4
            output/**/script.json
            output/**/publish_state.json
            output/**/validation.json
          if-no-files-found: warn
          retention-days: 7
      - name: Commit Curious Short state
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in used_topics.json analytics_registry.json learning_playbook.json analytics/topic_history.json analytics/videos.json analytics/playbook.json analytics/factory_memory_state.json completed_publications.json media_history.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync Curious Short state"
            pushed=""
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then pushed="yes"; break; fi
              git fetch origin main || true
              git rebase origin/main || { git rebase --abort || true; }
              sleep $((attempt * 3))
            done
            test -n "$pushed" || echo "Curious state push failed; artifact remains available."
          fi
