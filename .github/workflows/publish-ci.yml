name: Publish Shorts CI

on:
  push:
    paths:
      - "tts.py"
      - "tts_bridge.py"
      - "tts_content_guard.py"
      - "runtime_overrides.py"
      - "generate_script.py"
      - "generate_script/**"
      - "main.py"
      - "production_entry.py"
      - "production_entry_runner.py"
      - "tests/test_tts_speed.py"
      - "tests/test_publish_continuation.py"
      - ".github/workflows/publish.yml"
      - ".github/workflows/publish-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          pip install pytest numpy pyyaml
          pip install "moviepy<2"
      - name: Run Publish narration regression tests
        run: |
          python -m pytest -q tests/test_tts_speed.py tests/test_publish_continuation.py
      - name: Compile Publish narration runtime
        run: |
          python -m py_compile             tts.py             tts_bridge.py             tts_content_guard.py             runtime_overrides.py             main.py             production_entry.py             production_entry_runner.py
