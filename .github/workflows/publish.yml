name: Publish Short

on:
  schedule:
    - cron: "0 2 * * *"       # 07:30 IST
    - cron: "30 7 * * *"      # 13:00 IST
    - cron: "30 13 * * *"     # 19:00 IST

  workflow_dispatch: {}

concurrency:
  group: mint-yt-factory-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      IMAGEMAGICK_BINARY: /usr/bin/convert

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # ============================================================
      # WHISPER MODEL CACHE
      # ============================================================

      - name: Cache Whisper tiny.en model
        uses: actions/cache@v4
        with:
          path: ~/.cache/whisper
          key: whisper-tiny-en-v2

      # ============================================================
      # SYSTEM TOOLS
      # ============================================================

      - name: Install system tools
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "🔧 SYSTEM TOOL SETUP"
          echo "=========================================="

          echo ""
          echo "Operating System:"
          cat /etc/os-release | head -n 5

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "=========================================="
          echo "🎬 FFMPEG"
          echo "=========================================="

          if command -v ffmpeg >/dev/null 2>&1; then
            echo "✅ FFmpeg already available."
          else
            echo "⚠️ FFmpeg not found."
            echo "Installing FFmpeg..."

            sudo apt-get install \
              -y \
              --no-install-recommends \
              ffmpeg

            echo "✅ FFmpeg installed."
          fi

          echo ""
          echo "FFmpeg location:"
          command -v ffmpeg

          echo ""
          echo "FFmpeg version:"
          ffmpeg -version | head -n 1

          echo ""
          echo "=========================================="
          echo "🖼️ IMAGEMAGICK"
          echo "=========================================="

          if command -v magick >/dev/null 2>&1; then
            echo "✅ ImageMagick 'magick' already available."
            IM_PATH="$(command -v magick)"
          elif command -v convert >/dev/null 2>&1; then
            echo "✅ ImageMagick 'convert' already available."
            IM_PATH="$(command -v convert)"
          else
            echo "⚠️ ImageMagick not found."
            echo "Installing ImageMagick..."

            sudo apt-get install \
              -y \
              --no-install-recommends \
              imagemagick

            echo "✅ ImageMagick installed."

            if command -v magick >/dev/null 2>&1; then
              IM_PATH="$(command -v magick)"
            else
              IM_PATH="$(command -v convert)"
            fi
          fi

          echo ""
          echo "Detected ImageMagick:"
          echo "$IM_PATH"

          echo ""
          echo "Configured MoviePy ImageMagick binary:"
          echo "$IMAGEMAGICK_BINARY"

          if [ ! -x "$IMAGEMAGICK_BINARY" ]; then
            echo ""
            echo "❌ Configured ImageMagick binary does not exist:"
            echo "$IMAGEMAGICK_BINARY"

            echo ""
            echo "Available binaries:"
            command -v magick || true
            command -v convert || true

            exit 1
          fi

          echo ""
          echo "ImageMagick version:"
          "$IMAGEMAGICK_BINARY" --version | head -n 3

          echo ""
          echo "=========================================="
          echo "🔐 CONFIGURING IMAGEMAGICK POLICY"
          echo "=========================================="

          if [ -f /etc/ImageMagick-6/policy.xml ]; then
            echo "ImageMagick 6 policy detected."

            sudo sed -i \
              's/rights="none" pattern="@\*"/rights="read|write" pattern="@*"/' \
              /etc/ImageMagick-6/policy.xml \
              || true
          fi

          if [ -f /etc/ImageMagick-7/policy.xml ]; then
            echo "ImageMagick 7 policy detected."

            sudo sed -i \
              's/rights="none" pattern="@\*"/rights="read|write" pattern="@*"/' \
              /etc/ImageMagick-7/policy.xml \
              || true
          fi

          echo ""
          echo "=========================================="
          echo "🧪 TESTING FFMPEG"
          echo "=========================================="

          ffmpeg \
            -f lavfi \
            -i color=c=black:s=64x64:d=0.1 \
            -f null \
            - \
            -loglevel error

          echo "✅ FFmpeg test passed."

          echo ""
          echo "=========================================="
          echo "🧪 TESTING IMAGEMAGICK"
          echo "=========================================="

          TEMP_IMAGE="$(mktemp --suffix=.png)"

          "$IMAGEMAGICK_BINARY" \
            -size 100x100 \
            xc:white \
            "$TEMP_IMAGE"

          test -s "$TEMP_IMAGE"
          rm -f "$TEMP_IMAGE"

          echo "✅ ImageMagick test passed."

          echo ""
          echo "=========================================="
          echo "🔍 FINAL ENVIRONMENT"
          echo "=========================================="

          echo "IMAGEMAGICK_BINARY=$IMAGEMAGICK_BINARY"

          echo ""
          echo "FFmpeg:"
          command -v ffmpeg

          echo ""
          echo "ImageMagick:"
          command -v convert || true
          command -v magick || true

          echo ""
          echo "=========================================="
          echo "✅ SYSTEM TOOLS READY"
          echo "=========================================="

      # ============================================================
      # PYTHON DEPENDENCIES
      # ============================================================

      - name: Install Python dependencies
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "🐍 PYTHON DEPENDENCIES"
          echo "=========================================="

          python --version
          python -m pip --version

          echo ""
          echo "Upgrading pip..."
          python -m pip install --upgrade pip

          echo ""
          echo "Installing requirements.txt..."
          python -m pip install \
            --prefer-binary \
            -r requirements.txt

          echo ""
          echo "=========================================="
          echo "✅ PYTHON DEPENDENCIES INSTALLED"
          echo "=========================================="

      # ============================================================
      # VERIFY PYTHON PACKAGES
      # ============================================================

      - name: Verify Python environment
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "🔬 VERIFYING PYTHON ENVIRONMENT"
          echo "=========================================="

          python - <<'PY'
          import sys

          print("Python:", sys.version)

          checks = [
              "requests",
              "yaml",
              "moviepy",
              "PIL",
              "google.genai",
              "whisper",
          ]

          for module in checks:
              try:
                  __import__(module)
                  print("✅", module)
              except Exception as exc:
                  print("❌", module, exc)
                  raise
          PY

          echo ""
          echo "=========================================="
          echo "✅ PYTHON ENVIRONMENT VERIFIED"
          echo "=========================================="

      # ============================================================
      # RUN FACTORY
      # ============================================================

      - name: Run Mint-YT-Factory
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -e

          echo "=========================================="
          echo "🎬 MINT-YT-FACTORY"
          echo "=========================================="

          python main.py

          echo ""
          echo "=========================================="
          echo "✅ FACTORY COMPLETED"
          echo "=========================================="

      # ============================================================
      # UPLOAD ARTIFACTS
      # ============================================================

      - name: Upload production artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mint-yt-factory-${{ github.run_id }}
          path: |
            output/**
            logs/**
          if-no-files-found: ignore
          retention-days: 7
