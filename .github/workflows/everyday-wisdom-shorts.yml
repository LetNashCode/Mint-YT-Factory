name: Everyday Wisdom Shorts

on:
  workflow_dispatch: {}
  schedule:
    - cron: "30 3 * * *"
    - cron: "30 9 * * *"
    - cron: "30 15 * * *"

permissions:
  contents: write

concurrency:
  group: everyday-wisdom-shorts
  cancel-in-progress: false

jobs:
  everyday-wisdom:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and Publish caption font
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng fontconfig
          mkdir -p "$HOME/.local/share/fonts"
          cp assets/Fonts/Poppins-ExtraBold.ttf "$HOME/.local/share/fonts/"
          fc-cache -f

      - name: Install isolated dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            "google-genai>=1.30.0" \
            "requests>=2.31.0" \
            "kokoro>=0.9.4" \
            "soundfile>=0.12.1" \
            "numpy>=1.26.0" \
            "google-auth>=2.29.0" \
            "google-api-python-client>=2.130.0" \
            "faster-whisper>=1.1.0"

      - name: Preflight production inputs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY"
          test -n "$PEXELS_API_KEY"
          test -n "$YOUTUBE_TOKEN_JSON"
          test -s assets/music/blade_runner_2049.mp3
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of csv=p=0 assets/music/blade_runner_2049.mp3 | grep -qx audio
          python -m py_compile everyday_wisdom_shorts.py
          python - <<'PY'
          import json
          import os
          from google import genai
          from google.oauth2.credentials import Credentials
          from kokoro import KPipeline

          token = json.loads(os.environ["YOUTUBE_TOKEN_JSON"])
          credentials = Credentials.from_authorized_user_info(token)
          if not credentials.refresh_token:
              raise SystemExit("YOUTUBE_TOKEN_JSON is missing refresh_token")
          KPipeline(lang_code="a")
          genai.Client(api_key=os.environ["GEMINI_API_KEY"])

          from everyday_wisdom_shorts import (
              BACKGROUND_MUSIC_PATH,
              BACKGROUND_MUSIC_VOLUME,
              NARRATION_VOLUME,
              build_audio_filter,
          )
          assert BACKGROUND_MUSIC_PATH.is_file(), f"Missing soundtrack: {BACKGROUND_MUSIC_PATH}"
          assert 0 < BACKGROUND_MUSIC_VOLUME < NARRATION_VOLUME <= 1
          audio_filter = build_audio_filter(40.0)
          assert "[1:a]aresample=48000,volume=0.900[narration]" in audio_filter
          assert "[2:a]aresample=48000,volume=0.100" in audio_filter
          assert "[narration][music]amix=inputs=2:duration=first" in audio_filter
          print(f"Background music preflight passed: {BACKGROUND_MUSIC_PATH.name}")
          print("Production preflight passed.")
          PY

      - name: Run Everyday Wisdom Short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          WISDOM_KOKORO_VOICE: af_heart
        run: |
          set -euo pipefail
          python -u everyday_wisdom_shorts.py

      - name: Persist Everyday Wisdom topic history
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- everyday_wisdom_topic_history.json; then
            echo "No Everyday Wisdom topic-history changes to persist."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add everyday_wisdom_topic_history.json
          git commit -m "Update Everyday Wisdom topic history"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Upload production artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everyday-wisdom-${{ github.run_id }}
          path: .everyday_wisdom_runs/**
          if-no-files-found: warn
          retention-days: 7
