name: Publish Short

on:
  schedule:
    - cron: "0 2 * * *"       # 07:30 IST
    - cron: "30 7 * * *"      # 13:00 IST
    - cron: "30 13 * * *"     # 19:00 IST

  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------------
      # PYTHON
      # --------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # --------------------------------------------------------
      # FFMPEG
      # --------------------------------------------------------

      - name: Setup FFmpeg
        shell: bash
        run: |
          echo "=========================================="
          echo "🎬 Setting up FFmpeg"
          echo "=========================================="

          if command -v ffmpeg >/dev/null 2>&1; then
            echo "✅ FFmpeg already available"
            which ffmpeg
            ffmpeg -version | head -n 1

          else
            echo "⚠️ FFmpeg not found."
            echo "⬇️ Downloading static FFmpeg..."

            mkdir -p "$HOME/ffmpeg"
            cd "$HOME/ffmpeg"

            wget -q --show-progress \
              https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz

            echo "📦 Extracting FFmpeg..."

            tar -xf ffmpeg-release-amd64-static.tar.xz

            FFMPEG_DIR=$(find "$HOME/ffmpeg" \
              -maxdepth 1 \
              -type d \
              -name "ffmpeg-*-amd64-static" \
              | head -n 1)

            if [ -z "$FFMPEG_DIR" ]; then
              echo "❌ Could not locate extracted FFmpeg directory."
              exit 1
            fi

            echo "$FFMPEG_DIR" >> "$GITHUB_PATH"

            echo "✅ Static FFmpeg installed"
          fi

          echo "=========================================="
          echo "🎬 FFmpeg version"
          echo "=========================================="

          ffmpeg -version | head -n 1

      # --------------------------------------------------------
      # IMAGEMAGICK
      # --------------------------------------------------------

      - name: Check ImageMagick
        shell: bash
        run: |
          echo "=========================================="
          echo "🖼️ Checking ImageMagick"
          echo "=========================================="

          if command -v convert >/dev/null 2>&1; then

            echo "✅ ImageMagick already available"
            which convert
            convert --version | head -n 1

            # Allow @ file access if policy exists
            if [ -f /etc/ImageMagick-6/policy.xml ]; then
              sudo sed -i \
                's/rights="none" pattern="@\*"/rights="read|write" pattern="@*"/' \
                /etc/ImageMagick-6/policy.xml
            fi

            if [ -f /etc/ImageMagick-7/policy.xml ]; then
              sudo sed -i \
                's/rights="none" pattern="@\*"/rights="read|write" pattern="@*"/' \
                /etc/ImageMagick-7/policy.xml
            fi

          else

            echo "⚠️ ImageMagick not available."
            echo "Installing ImageMagick..."

            sudo apt-get update -qq
            sudo apt-get install -y imagemagick

            echo "✅ ImageMagick installed"

            which convert
            convert --version | head -n 1

            # Allow @ file access if policy exists
            if [ -f /etc/ImageMagick-6/policy.xml ]; then
              sudo sed -i \
                's/rights="none" pattern="@\*"/rights="read|write" pattern="@*"/' \
                /etc/ImageMagick-6/policy.xml
            fi

            if [ -f /etc/ImageMagick-7/policy.xml ]; then
              sudo sed -i \
                's/rights="none" pattern="@\*"/rights="read|write" pattern="@*"/' \
                /etc/ImageMagick-7/policy.xml
            fi

          fi

      # --------------------------------------------------------
      # PYTHON DEPENDENCIES
      # --------------------------------------------------------

      - name: Install Python dependencies
        run: |
          echo "=========================================="
          echo "🐍 Installing Python dependencies"
          echo "=========================================="

          python --version

          python -m pip install --upgrade pip

          python -m pip install -r requirements.txt

          echo "=========================================="
          echo "✅ Python dependencies installed"
          echo "=========================================="

      # --------------------------------------------------------
      # VERIFY ENVIRONMENT
      # --------------------------------------------------------

      - name: Verify environment
        run: |
          echo "=========================================="
          echo "🔍 ENVIRONMENT CHECK"
          echo "=========================================="

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "FFmpeg:"
          ffmpeg -version | head -n 1

          echo ""
          echo "ImageMagick:"
          convert --version | head -n 1

          echo ""
          echo "Memory:"
          free -h

          echo ""
          echo "Disk:"
          df -h

          echo ""
          echo "Working directory:"
          pwd

          echo ""
          echo "Files:"
          ls -lah

          echo ""
          echo "=========================================="
          echo "✅ ENVIRONMENT READY"
          echo "=========================================="

      # --------------------------------------------------------
      # YOUTUBE CREDENTIALS
      # --------------------------------------------------------

      - name: Write YouTube client credentials
        run: |
          echo "=========================================="
          echo "🔐 Setting up YouTube credentials"
          echo "=========================================="

          echo '${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}' > client_secret.json

          test -s client_secret.json || {
            echo "❌ YouTube client_secret.json is empty."
            exit 1
          }

          echo "✅ YouTube client credentials created."

      # --------------------------------------------------------
      # RUN PIPELINE
      # --------------------------------------------------------

      - name: Run Mint-YT-Factory
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}

        run: |
          echo "=========================================="
          echo "🚀 MINT-YT-FACTORY STARTED"
          echo "=========================================="

          echo ""
          echo "Start Time:"
          date

          echo ""
          echo "Runner:"
          uname -a

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "FFmpeg:"
          ffmpeg -version | head -n 1

          echo ""
          echo "Memory:"
          free -h

          echo ""
          echo "Disk:"
          df -h

          echo ""
          echo "=========================================="
          echo "🔬 Starting:"
          echo "   Research"
          echo "      ↓"
          echo "   Script"
          echo "      ↓"
          echo "   Visuals"
          echo "      ↓"
          echo "   TTS"
          echo "      ↓"
          echo "   Video"
          echo "      ↓"
          echo "   YouTube"
          echo "=========================================="

          python -u main.py

      # --------------------------------------------------------
      # UPLOAD FINAL VIDEO
      # --------------------------------------------------------

      - name: Upload Final Video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-video-${{ github.run_id }}
          path: output/**/final.mp4
          if-no-files-found: warn
          retention-days: 7

      # --------------------------------------------------------
      # UPLOAD GENERATED IMAGES
      # --------------------------------------------------------

      - name: Upload Generated Images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-images-${{ github.run_id }}
          path: output/**/visuals/
          if-no-files-found: warn
          retention-days: 7

      # --------------------------------------------------------
      # UPLOAD RESEARCH
      # --------------------------------------------------------

      - name: Upload Research Package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-${{ github.run_id }}
          path: output/**/research.json
          if-no-files-found: warn
          retention-days: 7

      # --------------------------------------------------------
      # UPLOAD SCRIPT
      # --------------------------------------------------------

      - name: Upload Generated Script
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: script-${{ github.run_id }}
          path: output/**/script.json
          if-no-files-found: warn
          retention-days: 7

      # --------------------------------------------------------
      # UPDATE USED TOPICS
      # --------------------------------------------------------

      - name: Commit updated used_topics.json
        if: success()
        run: |
          echo "=========================================="
          echo "📝 Updating used topics"
          echo "=========================================="

          git config user.name "auto-publish-bot"
          git config user.email "actions@github.com"

          git add used_topics.json

          if git diff --cached --quiet; then
            echo "No topic changes to commit."
            exit 0
          fi

          git commit -m "Update used topics [skip ci]"
          git push

      # --------------------------------------------------------
      # COMPLETE
      # --------------------------------------------------------

      - name: Pipeline complete
        if: success()
        run: |
          echo "=========================================="
          echo "🎉 MINT-YT-FACTORY COMPLETE"
          echo "=========================================="

          echo ""
          echo "Finished:"
          date

          echo ""
          echo "✅ Video generated"
          echo "✅ Video uploaded"
          echo "✅ Artifacts saved"
          echo "✅ Used topics updated"