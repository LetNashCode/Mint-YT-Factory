name: Mystery Footage Shorts

on:
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * 2,5"

permissions:
  contents: write

concurrency:
  group: mystery-footage-production
  cancel-in-progress: false

jobs:
  build-mystery-footage-short:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      MINT_KOKORO_VOICE: am_michael
      MINT_KOKORO_LANG: a
      MYSTERY_FOOTAGE_AUTO_DISCOVER: "true"
      MYSTERY_FOOTAGE_REQUIRE_STORY_SCREEN: "true"
      MYSTERY_FOOTAGE_MIN_STORY_SCORE: "6"
      MYSTERY_FOOTAGE_SKIP_IF_NO_ELIGIBLE: "true"
      MYSTERY_FOOTAGE_AUTO_UPLOAD: "true"
      MYSTERY_FOOTAGE_PRIVACY_STATUS: private
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install Pillow
      - name: Validate required secrets
        run: |
          test -n "$GEMINI_API_KEY" || (echo "Missing GEMINI_API_KEY" && exit 1)
          test -n "$YOUTUBE_TOKEN_JSON" || (echo "Missing YOUTUBE_TOKEN_JSON" && exit 1)
      - name: Discover archive footage candidates
        run: python mystery_footage_multisource_discovery.py
      - name: Screen footage quality and story potential
        run: python mystery_footage_screening.py
      - name: Check production candidate eligibility
        id: gate
        run: python mystery_footage_screening_gate.py
      - name: Generate mystery footage demo Short
        if: steps.gate.outputs.eligible == 'true'
        run: python mystery_footage_shorts.py
      - name: Add one-word captions
        if: steps.gate.outputs.eligible == 'true'
        run: |
          python mystery_footage_caption_overlay.py \
            --input artifacts/mystery-footage/mystery-footage-short.mp4 \
            --output artifacts/mystery-footage/mystery-footage-captioned.mp4
          mv artifacts/mystery-footage/mystery-footage-captioned.mp4 artifacts/mystery-footage/mystery-footage-short.mp4
      - name: Commit discovery and screening results for review
        run: |
          if git diff --quiet -- mystery_footage_catalog.json; then
            echo "No catalog changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add mystery_footage_catalog.json
            git commit -m "Record and screen archive mystery footage candidate"
            git push
          fi
      - name: Upload production artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mystery-footage-short-${{ github.run_number }}
          path: artifacts/mystery-footage/
          if-no-files-found: ignore
          retention-days: 7
