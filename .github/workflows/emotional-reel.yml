name: Emotional Text Reel
on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  actions: read
concurrency:
  group: emotional-text-reel
  cancel-in-progress: false
jobs:
  emotional-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg imagemagick
      - name: Install dependencies
        run: python -m pip install --prefer-binary -r requirements.txt
      - name: Generate and publish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION }}
          SOCIAL_PUBLISH_STRICT: "false"
          MINT_KOKORO_TTS: "1"
          MINT_TTS_PROVIDER: "kokoro"
          EMOTIONAL_REEL_KOKORO_VOICE: "am_michael"
          EMOTIONAL_REEL_KOKORO_SPEED: "0.92"
        run: python -u emotional_reel.py
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emotional-reel-${{ github.run_id }}
          path: output/emotional_reel/**