name: Bootstrap FFmpeg Cache

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  FFMPEG_CACHE_VERSION: v1
  FFMPEG_CACHE_DIR: ${{ github.workspace }}/.ffmpeg-cache

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Restore FFmpeg cache
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.FFMPEG_CACHE_DIR }}
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ env.FFMPEG_CACHE_VERSION }}

      - name: Download FFmpeg from GitHub Release
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e
          mkdir -p "$FFMPEG_CACHE_DIR"
          curl -L --fail --retry 3 --retry-delay 2 \
            -o "$RUNNER_TEMP/ffmpeg.tar.xz" \
            "https://github.com/LetNashCode/Mint-YT-Factory/releases/download/ffmpeg-runtime/ffmpeg-release-amd64-static.tar.xz"
          tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$FFMPEG_CACHE_DIR" --strip-components=1
          test -x "$FFMPEG_CACHE_DIR/ffmpeg"
          test -x "$FFMPEG_CACHE_DIR/ffprobe"
          rm -f "$RUNNER_TEMP/ffmpeg.tar.xz"

      - name: Verify FFmpeg
        shell: bash
        run: |
          set -e
          "$FFMPEG_CACHE_DIR/ffmpeg" -version | head -n 1
          "$FFMPEG_CACHE_DIR/ffprobe" -version | head -n 1
