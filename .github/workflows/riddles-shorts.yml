name: Riddles Shorts

on:
  schedule:
    - cron: "0 5 * * *"       # 10:30 IST
    - cron: "0 11 * * *"      # 16:30 IST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: mint-yt-factory-riddles
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install production dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg imagemagick tesseract-ocr espeak-ng
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -r requirements.txt

      - name: Verify pipeline
        run: |
          python -m py_compile interactive_main.py interactive_topics.py interactive_analytics.py generate_script/interactive.py whisper_align.py

      - name: Generate and publish Riddles Shorts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python -u interactive_main.py

      - name: Persist Riddle sequence state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interactive_topic_history.json pending_riddle.json riddle_counter.json analytics/interactive_videos.json analytics/interactive_comparison.json
          if ! git diff --cached --quiet; then
            git commit -m "Persist Riddles Shorts sequence state"
            git push
          fi

      - name: Upload production artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riddles-shorts-${{ github.run_id }}
          path: output/interactive/**
          if-no-files-found: warn
          retention-days: 7
