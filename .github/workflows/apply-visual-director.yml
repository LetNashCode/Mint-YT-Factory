name: Apply Visual Director Policy

on:
  push:
    paths:
      - ".github/workflows/apply-visual-director.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch generate_script.py
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path

          path = Path("generate_script.py")
          text = path.read_text(encoding="utf-8")

          old_styles = '''VALID_IMAGE_STYLE = {
              "realistic_3d_render",
              "scientific_illustration",
              "cinematic_photograph",
              "macro_photography",
              "infographic_diagram",
          }'''

          new_styles = '''VALID_IMAGE_STYLE = {
              "realistic_3d_render",
              "cinematic_photograph",
              "macro_photography",
          }'''

          if old_styles not in text:
              raise SystemExit("Could not find VALID_IMAGE_STYLE block; refusing to patch.")

          text = text.replace(old_styles, new_styles, 1)

          marker = '''============================================================
IMAGE PROMPTS
============================================================'''

          policy = '''============================================================
VISUAL DIRECTOR POLICY — STORY FIRST, NOT TEXTBOOK
============================================================

The visuals are a major part of the storytelling. They must feel like
real shots from an entertaining documentary or cinematic Short, not like
slides from a science textbook.

HARD RULES:

1. SHOW THE PHENOMENON LITERALLY.
   If the narration describes a person touching metal, show a real hand
   touching a real metal object. If it describes an animal, show the animal.
   If it describes an object, show the object.

2. PREFER RECOGNIZABLE REAL-WORLD SCENES.
   Use a person, animal, object, environment, experiment, machine, landscape,
   room, street, laboratory setup, or other concrete scene whenever the
   narration allows it.

3. NEVER TURN AN EXPLANATION INTO A TEXTBOOK DIAGRAM.
   Do NOT use scientific illustrations, infographic diagrams, flowcharts,
   schematic drawings, anatomy diagrams, textbook cross-sections, arrows,
   energy vectors, labeled parts, graphs, charts, equations, UI panels,
   microscopic fantasy structures, or abstract concept art.

4. NEVER VISUALIZE UNSEEN MECHANISMS AS IF THEY ARE A CAMERA VIEW.
   If a mechanism is invisible, represent it with a believable physical
   consequence or a grounded cinematic metaphor. Do not invent microscopic
   structures, receptors, particles, forces, pathways, or internal anatomy
   unless the narration explicitly requires a scientifically established
   visible structure.

5. DO NOT INVENT VISUAL FACTS.
   The image must not imply a mechanism, object, experiment, location,
   researcher, device, anatomy, or physical process that the supplied
   evidence does not support.

6. KEEP THE VISUAL STORY MOVING.
   Shot 1 should establish a recognizable moment.
   Shot 2 should reveal a new detail, reaction, consequence, comparison,
   perspective, or physical change. Do not make two nearly identical stills.

7. USE CINEMATIC CAMERA LANGUAGE THROUGH THE METADATA FIELDS.
   Favor close-ups, medium shots, wide shots, top-down views, side views,
   and occasional macro shots when they genuinely reveal something useful.

8. REALISTIC STYLE DEFAULT.
   Prefer realistic_3d_render or cinematic_photograph.
   Use macro_photography only when a real close-up of a material, texture,
   surface, or small physical detail adds storytelling value.

9. HUMAN-CENTERED VISUALS WHEN APPROPRIATE.
   For everyday phenomena, prefer a believable human action over an abstract
   diagram. Hands, faces, reactions, objects being handled, and environments
   are strong visual anchors.

10. VISUAL PROMPTS MUST BE CONCRETE.
    A good prompt answers: WHO/WHAT is visible, WHAT are they doing, WHERE
    are they, WHAT changes, and WHAT is the viewer meant to notice.

BAD VISUAL:
"A scientific diagram of thermal receptors detecting heat transfer."

GOOD VISUAL:
"A person's fingertips touch a polished metal block on a wooden workbench,
with the hand immediately pulling back in surprise."

BAD VISUAL:
"An animated thermal energy vector moving through a metal crystal."

GOOD VISUAL:
"Extreme close-up of fingertips resting on the cold metal surface while
the hand reacts to the chill."

BAD VISUAL:
"A cross-section of skin showing microscopic heat receptors."

GOOD VISUAL:
"Close-up of a person's fingertips touching the metal block, followed by a
clear change in the hand's reaction as it moves away from the surface."

The image_prompt itself should describe only visible content. Do not put
camera settings, aspect ratios, captions, narration, or negative prompts
inside image_prompt.


============================================================
IMAGE PROMPTS
============================================================'''

          if marker not in text:
              raise SystemExit("Could not find IMAGE PROMPTS marker; refusing to patch.")

          if "VISUAL DIRECTOR POLICY — STORY FIRST, NOT TEXTBOOK" not in text:
              text = text.replace(marker, policy, 1)

          text = text.replace("Version 10.2", "Version 10.3", 1)

          path.write_text(text, encoding="utf-8")
          print("✅ Visual Director policy applied.")
          PY

      - name: Validate patch
        shell: bash
        run: |
          set -e
          grep -q 'Version 10.3' generate_script.py
          grep -q 'VISUAL DIRECTOR POLICY — STORY FIRST, NOT TEXTBOOK' generate_script.py
          if grep -q '"scientific_illustration"' generate_script.py; then exit 1; fi
          if grep -q '"infographic_diagram"' generate_script.py; then exit 1; fi
          echo "✅ Visual Director validation passed."

      - name: Commit patched generator
        shell: bash
        run: |
          set -e
          git config user.name "auto-publish-bot"
          git config user.email "actions@github.com"
          git add generate_script.py
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Improve story-first visual direction [skip ci]"
            git push
          fi

      - name: Remove one-time patch workflow
        shell: bash
        run: |
          set -e
          git rm .github/workflows/apply-visual-director.yml
          git commit -m "Remove one-time visual director patch workflow [skip ci]"
          git push
