name: Story Shorts
on:
  push:
    paths:
      - 'story_*.py'
      - 'interactive_main.py'
      - 'interactive_topics.py'
      - 'interactive_analytics.py'
      - 'factory_content_memory.py'
      - 'learning_engine.py'
      - 'learning_context.py'
      - 'youtube_analytics.py'
      - 'topic_history.py'
      - 'generate_script/interactive.py'
      - 'tests/test_story_*.py'
      - 'tests/test_factory_content_memory.py'
      - 'tests/test_learning_engine.py'
      - 'tests/test_workflow_state_isolation.py'
      - '.github/workflows/story-shorts.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 11 * * *'
permissions:
  contents: write
  actions: read
env:
  MINT_WORKFLOW_PROFILE: story
concurrency:
  group: mint-story-shorts
  cancel-in-progress: false
jobs:
  story-shorts:
    # One explicit production verification run can be triggered by a specially named commit.
    # Ordinary code pushes never publish; scheduled and manual runs remain unchanged.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[story-rebuild-verify]')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq unzip curl
          ffprobe -version | head -n 1
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install opencv-python-headless==4.10.0.84
      - name: Restore latest previous Story render artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p output/interactive
          artifacts_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100"
          artifacts_json="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${artifacts_url}")"
          artifact_id="$(jq -r --arg current "${CURRENT_RUN_ID}" --arg branch "${GITHUB_REF_NAME}" '[.artifacts[] | select((.name // "") | startswith("story-shorts-")) | select(.expired == false) | select((.workflow_run.id // 0) != ($current | tonumber)) | select((.workflow_run.head_branch // "") == $branch)] | sort_by(.created_at) | reverse | .[0].id // empty' <<< "${artifacts_json}")"
          if [ -n "${artifact_id}" ]; then
            curl -fsSL -L -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" -o /tmp/story-render.zip
            unzip -oq /tmp/story-render.zip -d .
          else
            echo "ℹ️ No previous Story render artifact available"
          fi
      - name: Compile Story Shorts runtime and quality gates
        run: python -m py_compile tts.py interactive_main.py interactive_topics.py interactive_analytics.py story_render_recovery.py story_social_resume.py story_youtube_metadata.py story_identity_runner.py story_visual_upgrade.py story_real_video_media.py story_qwen_vision_fallback.py story_archival_media.py story_media_quality.py story_topic_runtime.py story_topic_uniqueness.py story_stock_runtime.py story_topic_media_lock.py story_media_preflight.py story_gemini_budget.py final_video_quality_gate.py publication_state.py social_retry_state.py upload_youtube.py validate_video.py assemble.py
      - name: Resume pending Story social publication
        id: resume
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION }}
          SOCIAL_PUBLISH_STRICT: ${{ vars.SOCIAL_PUBLISH_STRICT }}
        run: |
          set -euo pipefail
          if [ -f story_social_queue.json ]; then
            python -u story_social_resume.py
            echo "resumed=true" >> "$GITHUB_OUTPUT"
          else
            echo "resumed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Recover completed Story render before starting a new render
        id: recover
        if: success() && steps.resume.outputs.resumed != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION }}
          SOCIAL_PUBLISH_STRICT: ${{ vars.SOCIAL_PUBLISH_STRICT }}
        run: |
          set -euo pipefail
          set +e
          python -u story_render_recovery.py
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "recovered=true" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -eq 1 ]; then
            echo "recovered=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Story render recovery failed (exit $rc). No new Story generation will be attempted."
            exit "$rc"
          fi
      - name: Generate and publish Story Short
        timeout-minutes: 75
        if: steps.recover.outputs.recovered != 'true' && steps.resume.outputs.resumed != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION }}
          SOCIAL_PUBLISH_STRICT: ${{ vars.SOCIAL_PUBLISH_STRICT }}
          STORY_GEMINI_MAX_REQUESTS: ${{ vars.STORY_GEMINI_MAX_REQUESTS || '180' }}
          STORY_GEMINI_MAX_REQUESTS_PER_SUBJECT: ${{ vars.STORY_GEMINI_MAX_REQUESTS_PER_SUBJECT || '18' }}
          STORY_GEMINI_MAX_VISUAL_REQUESTS: ${{ vars.STORY_GEMINI_MAX_VISUAL_REQUESTS || '160' }}
          # Bound each visual-verifier network call and allow one retry; a provider outage must defer quickly.
          STORY_GEMINI_REQUEST_TIMEOUT: ${{ vars.STORY_GEMINI_REQUEST_TIMEOUT || '45' }}
          STORY_GEMINI_NETWORK_RETRIES: ${{ vars.STORY_GEMINI_NETWORK_RETRIES || '2' }}
          STORY_GEMINI_TRANSIENT_RETRIES: ${{ vars.STORY_GEMINI_TRANSIENT_RETRIES || '5' }}
          STORY_MAX_VERIFICATION_SOURCES: ${{ vars.STORY_MAX_VERIFICATION_SOURCES || '8' }}
          STORY_PREFLIGHT_SOURCE_LIMIT: ${{ vars.STORY_PREFLIGHT_SOURCE_LIMIT || '6' }}
          STORY_MIN_PREFLIGHT_SOURCES: ${{ vars.STORY_MIN_PREFLIGHT_SOURCES || '1' }}
          STORY_TOPIC_ATTEMPTS: ${{ vars.STORY_TOPIC_ATTEMPTS || '16' }}
          STORY_SOURCE_MAX_REJECTIONS: ${{ vars.STORY_SOURCE_MAX_REJECTIONS || '4' }}
          # Qwen2-VL is intentionally disabled in GitHub Actions: CPU inference is too slow
          # for the 14-clip footage-first production path. Gemini remains the production verifier.
          ENABLE_CPU_QWEN_FALLBACK: '0'
          ENABLE_QWEN_VISION_FALLBACK: '0'
        run: |
          set -euo pipefail
          # Start each production attempt with no stale publication result.
          # Recovery/resume paths have already completed before this step when applicable.
          rm -f .story_publication_status.json .story_deferred
          rm -f .story_gemini_quota_deferred .story_verifier_budget_deferred .story_gemini_budget_deferred .story_gemini_network_deferred
          echo "🎬 Story media route: verified real-person video segments (Commons, Internet Archive; no YouTube downloads)"
          python -u youtube_auth_preflight.py
          set +e
          python -u - <<'PY'
          import sys, traceback
          try:
              from media_frame_guard import patch_assemble_rgb
              patch_assemble_rgb()
              import story_topic_runtime, story_stock_runtime, story_topic_media_lock
              import story_identity_runner
              story_identity_runner.main()
          except Exception:
              traceback.print_exc(file=sys.stdout)
              raise SystemExit(1)
          PY
          rc=$?
          set -e

          # Any non-zero production result is a failed Story publication attempt.
          # Deferred runs are intentionally NOT green: no video was published.
          if [ "$rc" -ne 0 ]; then
            status="$(jq -r '.status // ""' .story_publication_status.json 2>/dev/null || true)"
            echo "::error::Story Shorts did not publish completely. Status=$status"
            exit "$rc"
          fi
          exit 0
      - name: Report Story media diagnostics
        if: failure()
        run: |
          python -u - <<'PY'
          import json
          from pathlib import Path
          audits = sorted(Path('output/interactive').rglob('story_video_audit.json'), key=lambda p: p.stat().st_mtime)
          if audits:
              data = json.loads(audits[-1].read_text())
              print(json.dumps({'person': data.get('person'), 'providers': data.get('providers'),
                  'selected_count': len(data.get('selected', [])), 'last_attempts': data.get('attempts', [])[-20:]}, indent=2))
          else:
              print('No Story media audit was created before the failure.')
          PY
      - name: Verify Story Shorts completed publication
        if: always()
        run: |
          set -euo pipefail
          status_file=".story_publication_status.json"
          if [ ! -f "$status_file" ]; then
            echo "::error::Story Shorts finished without a publication status file. No successful publication was confirmed."
            exit 1
          fi
          status="$(jq -r '.status // ""' "$status_file")"
          video_id="$(jq -r '.video_id // ""' "$status_file")"
          url="$(jq -r '.youtube_url // ""' "$status_file")"
          echo "Story publication status: $status"

          if [ "$status" != "complete" ] || [ -z "$video_id" ]; then
            reason="$(jq -r '.reason // "No complete multi-platform publication was confirmed."' "$status_file")"
            echo "::error::Story Shorts did not complete successfully. Status=$status Reason=$reason"
            exit 1
          fi

          for platform in youtube instagram facebook; do
            platform_status="$(jq -r --arg platform "$platform" '.platforms[$platform].status // ""' "$status_file")"
            if [ "$platform_status" != "published" ]; then
              echo "::error::Story Shorts is not fully published: $platform status=$platform_status"
              exit 1
            fi
          done

          youtube_state_id="$(jq -r '.platforms.youtube.video_id // .video_id // ""' "$status_file")"
          if [ -z "$youtube_state_id" ] || [ "$youtube_state_id" != "$video_id" ]; then
            echo "::error::YouTube publication ID is missing or inconsistent in publication state."
            exit 1
          fi
          echo "## Story Shorts publication confirmed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- YouTube video ID: $video_id" >> "$GITHUB_STEP_SUMMARY"
          echo "- YouTube URL: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: COMPLETE" >> "$GITHUB_STEP_SUMMARY"
      - name: Persist Story Shorts state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for state_file in story_topic_history.json pending_story.json story_counter.json story_candidates.json story_footage_catalog.json story_social_queue.json interactive_analytics.json interactive_analytics_history.json story_video_rejection_cache.json analytics/story_videos.json analytics/story/topic_history.json analytics/story/videos.json analytics/story/summary.json analytics/story/playbook.json analytics/story/used_topics.json analytics/story/factory_memory_state.json analytics/story/story_comparison.json .story_publication_status.json .story_deferred .story_gemini_quota_deferred .story_verifier_budget_deferred .story_gemini_budget_deferred .story_gemini_network_deferred; do
            if [ -f "$state_file" ] || git ls-files --error-unmatch "$state_file" >/dev/null 2>&1; then
              git add -A -- "$state_file"
            fi
          done
          git diff --cached --quiet || git commit -m "Persist Story Shorts state"

          # The render can run for a long time while normal repository commits land on
          # main. Rebase the state commit onto the latest main, but merge the two
          # append/derived analytics JSON files at the data level instead of allowing
          # Git's line-based JSON merge to fail the entire Story run.
          branch="${GITHUB_REF_NAME}"

          # Some Story tooling can touch auxiliary/generated files that are not part
          # of the persisted state list above. Git refuses to rebase a dirty worktree,
          # so temporarily stash anything left over (while keeping render output in
          # place for the artifact upload), then restore it after the state push.
          story_stash_marker="$(git rev-parse --verify refs/stash 2>/dev/null || true)"
          story_stash_created=false
          if ! git diff --quiet || ! git diff --cached --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "ℹ️ Stashing non-persisted Story workspace changes before rebase:"
            git status --short
            git stash push -u -m "Story Shorts temporary persistence stash" -- . ':(exclude)output/**' || true
            new_story_stash_marker="$(git rev-parse --verify refs/stash 2>/dev/null || true)"
            if [ -n "$new_story_stash_marker" ] && [ "$new_story_stash_marker" != "$story_stash_marker" ]; then
              story_stash_created=true
            fi
          fi

          restore_story_stash() {
            if [ "$story_stash_created" = true ]; then
              echo "🔄 Restoring temporary Story workspace changes"
              if ! git stash pop; then
                echo "::warning::Temporary Story workspace changes could not be reapplied cleanly; the persisted Story state was already pushed."
              fi
            fi
          }

          max_attempts=5
          for attempt in $(seq 1 "$max_attempts"); do
            echo "🔄 Persist Story state: sync attempt $attempt/$max_attempts"
            git fetch origin "$branch"

            if git rebase "origin/$branch"; then
              if git push origin HEAD:"$branch"; then
                echo "✅ Story Shorts state pushed successfully"
                restore_story_stash
                break
              fi
              echo "⚠️ Push raced with another commit; retrying after refetch."
              if [ "$attempt" -eq "$max_attempts" ]; then
                echo "::error::Could not push Story Shorts state after $max_attempts attempts."
                restore_story_stash
                exit 1
              fi
              continue
            fi

            conflicted="$(git diff --name-only --diff-filter=U)"
            echo "⚠️ Rebase conflicts: $conflicted"

            # Only auto-resolve the known machine-generated analytics JSON files.
            # Any source/workflow conflict remains a hard failure rather than being
            # silently overwritten.
            unexpected="$(printf '%s\\n' "$conflicted" | grep -Ev '^(analytics/story/playbook[.]json|analytics/story/videos[.]json)$' || true)"
            if [ -n "$unexpected" ]; then
              echo "::error::Unexpected Story state rebase conflict(s):"
              printf '%s\\n' "$unexpected"
              git rebase --abort || true
              restore_story_stash
              exit 1
            fi

            python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          PATHS = ("analytics/story/playbook.json", "analytics/story/videos.json")

          def stage(path, stage):
              try:
                  return subprocess.check_output(
                      ["git", "show", f":{stage}:{path}"],
                      text=True,
                  )
              except subprocess.CalledProcessError:
                  return None

          def load(raw, fallback):
              if raw is None:
                  return fallback
              try:
                  return json.loads(raw)
              except Exception:
                  return fallback

          def merge3(base, ours, theirs):
              if ours == theirs:
                  return ours
              if ours == base:
                  return theirs
              if theirs == base:
                  return ours

              if isinstance(base, dict) and isinstance(ours, dict) and isinstance(theirs, dict):
                  out = {}
                  for key in sorted(set(base) | set(ours) | set(theirs)):
                      b = base.get(key)
                      o = ours.get(key)
                      t = theirs.get(key)
                      if key not in ours:
                          out[key] = t
                      elif key not in theirs:
                          out[key] = o
                      else:
                          out[key] = merge3(b, o, t)
                  return out

              if isinstance(ours, list) and isinstance(theirs, list):
                  # Analytics lists are append/collection data. Keep both sides,
                  # de-duplicating by canonical JSON representation.
                  out = []
                  seen = set()
                  for item in ours + theirs:
                      marker = json.dumps(item, sort_keys=True, ensure_ascii=False, separators=(",", ":"))
                      if marker not in seen:
                          seen.add(marker)
                          out.append(item)
                  return out

              # For scalar conflicts, the Story run's freshly generated state wins.
              return ours

          for path in PATHS:
              base_raw = stage(path, 1)
              ours_raw = stage(path, 2)
              theirs_raw = stage(path, 3)

              base = load(base_raw, None)
              ours = load(ours_raw, None)
              theirs = load(theirs_raw, None)

              if ours is None and theirs is None:
                  Path(path).unlink(missing_ok=True)
                  continue
              if ours is None:
                  merged = theirs
              elif theirs is None:
                  merged = ours
              else:
                  merged = merge3(base, ours, theirs)

              Path(path).parent.mkdir(parents=True, exist_ok=True)
              Path(path).write_text(
                  json.dumps(merged, indent=2, ensure_ascii=False) + "\n",
                  encoding="utf-8",
              )
          PY

            git add analytics/story/playbook.json analytics/story/videos.json
            GIT_EDITOR=true git rebase --continue
          done
      - name: Upload Story Shorts artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-shorts-${{ github.run_id }}
          path: output/interactive/**
          if-no-files-found: ignore
          retention-days: 7
