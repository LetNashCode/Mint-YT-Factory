name: One-time FFmpeg Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Apply static FFmpeg setup [skip ci]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch publish workflow
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/publish.yml')
          text = path.read_text()

          old = '''          if command -v ffmpeg >/dev/null 2>&1; then
            echo "✅ FFmpeg already available."
          else
            echo "⚠️ FFmpeg not found."
            echo "Installing FFmpeg..."

            sudo apt-get install \\
              -y \\
              --no-install-recommends \\
              ffmpeg

            echo "✅ FFmpeg installed."
          fi'''

          new = '''          if command -v ffmpeg >/dev/null 2>&1; then
            echo "✅ FFmpeg already available."
          else
            echo "⚠️ FFmpeg not found."
            echo "Installing a static FFmpeg binary instead of apt-get dependencies..."

            FFMPEG_DIR="$RUNNER_TEMP/ffmpeg"
            FFMPEG_ARCHIVE="$RUNNER_TEMP/ffmpeg.tar.xz"
            mkdir -p "$FFMPEG_DIR"

            curl -L --fail --retry 3 --retry-delay 2 \\
              -o "$FFMPEG_ARCHIVE" \\
              "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz"

            tar -xJf "$FFMPEG_ARCHIVE" -C "$FFMPEG_DIR"

            FFMPEG_BIN="$(find "$FFMPEG_DIR" -type f -name ffmpeg -perm -u+x | head -n 1)"
            FFPROBE_BIN="$(find "$FFMPEG_DIR" -type f -name ffprobe -perm -u+x | head -n 1)"

            if [ -z "$FFMPEG_BIN" ]; then
              echo "❌ Static FFmpeg binary was not found after extraction."
              exit 1
            fi

            sudo install -m 0755 "$FFMPEG_BIN" /usr/local/bin/ffmpeg

            if [ -n "$FFPROBE_BIN" ]; then
              sudo install -m 0755 "$FFPROBE_BIN" /usr/local/bin/ffprobe
            fi

            rm -rf "$FFMPEG_DIR" "$FFMPEG_ARCHIVE"

            echo "✅ Static FFmpeg installed at /usr/local/bin/ffmpeg."
          fi'''

          if old not in text:
              raise SystemExit('Expected FFmpeg installation block was not found; refusing to modify the workflow.')

          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          set -e
          git config user.name "auto-publish-bot"
          git config user.email "actions@github.com"
          rm -f .github/workflows/one-time-ffmpeg-fix.yml
          git add .github/workflows/publish.yml .github/workflows/one-time-ffmpeg-fix.yml
          git commit -m "Apply static FFmpeg setup [skip ci]"
          git push
