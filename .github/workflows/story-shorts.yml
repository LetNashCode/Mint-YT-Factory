name: Story Shorts
on:
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 11 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: story-shorts-pipeline
  cancel-in-progress: false
jobs:
  story-shorts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq unzip curl
          ffprobe -version | head -n 1
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Run Story quality tests
        run: pytest -q tests/test_story_media_quality.py
      - name: Restore latest previous Story render artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p output/interactive
          artifacts_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100"
          artifacts_json="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${artifacts_url}")"
          artifact_id="$(jq -r --arg current "${CURRENT_RUN_ID}" '[.artifacts[] | select((.name // "") | startswith("story-shorts-")) | select(.expired == false) | select((.workflow_run.id // 0) != ($current | tonumber))] | sort_by(.created_at) | reverse | .[0].id // empty' <<< "${artifacts_json}")"
          if [ -n "${artifact_id}" ]; then
            curl -fsSL -L -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" -o /tmp/story-render.zip
            unzip -oq /tmp/story-render.zip -d .
          else
            echo "ℹ️ No previous Story render artifact available"
          fi
      - name: Compile Story Shorts runtime and quality gates
        run: python -m py_compile interactive_main.py story_render_recovery.py story_social_resume.py story_identity_runner.py story_archival_media.py story_media_quality.py final_video_quality_gate.py publication_state.py social_retry_state.py upload_youtube.py validate_video.py assemble.py
      - name: Recover completed Story render before starting a new render
        id: recover
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
        run: |
          set -euo pipefail
          if python -u story_render_recovery.py; then
            echo "recovered=true" >> "$GITHUB_OUTPUT"
          else
            echo "recovered=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Resume pending Story social publication
        id: resume
        if: steps.recover.outputs.recovered != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
        run: |
          set -euo pipefail
          if [ -f story_social_queue.json ]; then
            python -u story_social_resume.py
            echo "resumed=true" >> "$GITHUB_OUTPUT"
          else
            echo "resumed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate and publish Story Short
        if: steps.recover.outputs.recovered != 'true' && steps.resume.outputs.resumed != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
        run: |
          set -euo pipefail
          echo "📚 Story media route: Wikimedia Commons archival assets"
          python -u youtube_auth_preflight.py
          python -c "from media_frame_guard import patch_assemble_rgb; patch_assemble_rgb(); import story_topic_runtime; import story_stock_runtime; import story_topic_media_lock; import story_identity_runner; story_identity_runner.main()"
      - name: Persist Story Shorts state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add story_topic_history.json pending_story.json story_counter.json story_candidates.json story_social_queue.json interactive_analytics.json interactive_analytics_history.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Persist Story Shorts state"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "${GITHUB_REF_NAME}"
      - name: Upload Story Shorts artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-shorts-${{ github.run_id }}
          path: output/interactive/**
          if-no-files-found: ignore
          retention-days: 7
