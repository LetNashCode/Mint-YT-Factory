name: Emotional Text Reel
on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  actions: read
concurrency:
  group: emotional-text-reel
  cancel-in-progress: false
jobs:
  emotional-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Verify Emotional Reel production revision
        shell: bash
        run: |
          echo "EMOTIONAL_REEL_COMMIT=$(git rev-parse HEAD)"
          if grep -q "amix=inputs=2" emotional_reel.py; then
            echo "EMOTIONAL_REEL_AUDIO_PIPELINE=single-mixed-stream"
          else
            echo "EMOTIONAL_REEL_AUDIO_PIPELINE=legacy"
            echo "ERROR: workflow checked out a revision without the fixed audio mixer."
            exit 1
          fi
          if grep -q "Production encoding:" emotional_reel.py; then
            echo "ERROR: legacy Emotional Reel renderer detected."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Detect pending Emotional Reel render
        id: resume_state
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("output/emotional_reel/resume_state.json")
          pending=False
          key=""
          if p.exists():
              try:
                  s=json.loads(p.read_text())
                  pending=s.get("status")=="pending_upload"
                  key=str(s.get("cache_key",""))
              except Exception:
                  pass
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"pending={str(pending).lower()}\n")
              f.write(f"cache_key={key}\n")
          print(f"EMOTIONAL_REEL_PENDING={pending}")
          print(f"EMOTIONAL_REEL_CACHE_KEY={key}")
      - name: Restore rendered Emotional Reel
        if: steps.resume_state.outputs.pending == 'true'
        uses: actions/cache/restore@v4
        with:
          path: output/emotional_reel/final.mp4
          key: ${{ steps.resume_state.outputs.cache_key }}
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg imagemagick
      - name: Install dependencies
        run: python -m pip install --prefer-binary -r requirements.txt
      - name: Generate and publish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION }}
          SOCIAL_PUBLISH_STRICT: "false"
          MINT_KOKORO_TTS: "1"
          MINT_TTS_PROVIDER: "kokoro"
          EMOTIONAL_REEL_KOKORO_VOICE: "am_echo"
          EMOTIONAL_REEL_KOKORO_SPEED: "0.92"
          MINT_MAX_PLAYBACK_SPEED: "1.25"
        run: python -u emotional_reel.py
      - name: Read final Emotional Reel cache key
        if: always()
        id: final_state
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("output/emotional_reel/resume_state.json")
          key=""
          if p.exists():
              try:
                  key=str(json.loads(p.read_text()).get("cache_key",""))
              except Exception:
                  pass
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"cache_key={key}\n")
          print(f"FINAL_EMOTIONAL_REEL_CACHE_KEY={key}")
      - name: Save rendered Emotional Reel cache
        if: always() && hashFiles('output/emotional_reel/final.mp4') != '' && steps.final_state.outputs.cache_key != ''
        uses: actions/cache/save@v4
        with:
          path: output/emotional_reel/final.mp4
          key: ${{ steps.final_state.outputs.cache_key }}
      - name: Commit Emotional Reel resume state
        if: always()
        shell: bash
        run: |
          if [ -f output/emotional_reel/resume_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add output/emotional_reel/resume_state.json
            if ! git diff --cached --quiet; then
              git commit -m "Persist Emotional Reel render resume state"
              git push
            fi
          fi
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emotional-reel-${{ github.run_id }}
          path: output/emotional_reel/**