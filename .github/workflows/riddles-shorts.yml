name: Story Shorts

on:
  schedule:
    - cron: "0 5 * * *"       # 10:30 IST
    - cron: "0 11 * * *"      # 16:30 IST
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

concurrency:
  group: mint-yt-factory-story-shorts
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install production dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg imagemagick tesseract-ocr espeak-ng
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -r requirements.txt

      - name: Verify pipeline
        run: |
          python -m py_compile \
            interactive_main.py interactive_topics.py interactive_analytics.py \
            generate_script/interactive.py whisper_align.py social_publish.py \
            story_person_media.py story_media_preflight.py story_social_resume.py \
            tts.py assemble.py stock_media_resilient.py upload_youtube.py \
            validate_video.py music.py sfx.py media_frame_guard.py

      - name: Resume pending Story social publication
        id: resume
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION }}
          SOCIAL_PUBLISH_STRICT: ${{ vars.SOCIAL_PUBLISH_STRICT }}
        run: |
          if [ -f story_social_queue.json ]; then
            python -u story_social_resume.py
            echo "resumed=true" >> "$GITHUB_OUTPUT"
          else
            echo "resumed=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ No pending Story social work found."
          fi

      - name: Generate and publish Story Short
        if: steps.resume.outputs.resumed != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION }}
          SOCIAL_PUBLISH_STRICT: ${{ vars.SOCIAL_PUBLISH_STRICT }}
        run: python -c "from media_frame_guard import patch_assemble_rgb; patch_assemble_rgb(); import runpy; runpy.run_path('interactive_main.py', run_name='__main__')"

      - name: Persist Story sequence and recovery state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add story_topic_history.json pending_story.json story_counter.json story_candidates.json story_social_queue.json analytics/story_videos.json analytics/story_comparison.json
          if ! git diff --cached --quiet; then
            git commit -m "Persist Story Shorts sequence and recovery state"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload production artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-shorts-${{ github.run_id }}
          path: output/interactive/**
          if-no-files-found: warn
          retention-days: 7
